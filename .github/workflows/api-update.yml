name: TOPdesk API update

# Once a week: download the newest TOPdesk API specifications, regenerate the commands,
# the coverage report and the docs, test the result and open (or update) a pull request.
on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would change; do not push or open a pull request or issue.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: api-update
  cancel-in-progress: false

env:
  UPDATE_BRANCH: apigen/api-update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download the newest specifications and regenerate
        run: |
          python -m pip install --quiet pyyaml
          python build/apigen/apigen.py fetch | tee "$RUNNER_TEMP/fetch.txt"
          python build/apigen/apigen.py generate | tee "$RUNNER_TEMP/generate.txt"

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name PSFramework -Force -Scope CurrentUser
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Regenerate the command reference
        shell: pwsh
        run: ./build/New-TdCommandDoc.ps1

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The TOPdesk API specifications have not changed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the tests
        id: tests
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          Import-Module PSFramework
          ./TOPdeskPS/tests/pester.ps1 -OutputPath (Join-Path $env:RUNNER_TEMP 'TestResults')

      - name: Write the pull request text
        if: steps.changes.outputs.changed == 'true'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            echo "The weekly check found changes in the official TOPdesk API specifications on developers.topdesk.com."
            echo
            echo "### Specification versions"
            echo '```diff'
            git --no-pager diff -U0 -- build/apigen/specs.lock.json | grep -E '^[+-] +"(version|file)"' || echo "(no version changes)"
            echo '```'
            echo
            echo "### Generator"
            echo '```'
            cat "$RUNNER_TEMP/generate.txt"
            echo '```'
            echo
            echo "### Changed files"
            echo '```'
            git --no-pager diff --stat | tail -n 40
            git ls-files --others --exclude-standard | sed 's/^/new: /' | head -n 40
            echo '```'
            echo
            if [ "$TEST_OUTCOME" = "success" ]; then
              echo "Tests: passed on PowerShell 7 (Linux). CI runs the full matrix on this pull request."
            else
              echo "Tests: **failed** on PowerShell 7 (Linux). See the run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            echo
            echo "Review the generated commands and docs/api-coverage.md before merging. New operations that need a better name or should be skipped go into build/apigen/overrides.yaml."
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Show the changes (dry run)
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run
        run: |
          echo "Dry run: nothing is pushed and no pull request or issue is opened."
          cat "$RUNNER_TEMP/pr-body.md"
          git --no-pager diff --stat

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$UPDATE_BRANCH"
          git add -A
          git commit --quiet -m "Update to the latest TOPdesk API specifications" -m "Generated by the weekly TOPdesk API update workflow."
          # The branch only ever holds this workflow's own commit, so it is replaced on every run.
          git push --force origin "$UPDATE_BRANCH"

          title="Update to the latest TOPdesk API specifications"
          existing=$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated pull request #$existing" >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "Opened a pull request" >> "$GITHUB_STEP_SUMMARY"
          else
            # Happens when "Allow GitHub Actions to create and approve pull requests" is off.
            echo "::warning::Could not open a pull request; opening an issue instead."
            {
              echo "The changes are on the branch \`$UPDATE_BRANCH\`; open a pull request from it to review them."
              echo "To let this workflow open the pull request itself, enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
              echo
              cat "$RUNNER_TEMP/pr-body.md"
            } > "$RUNNER_TEMP/issue-body.md"
            open_issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
            if [ -n "$open_issue" ]; then
              gh issue comment "$open_issue" --body-file "$RUNNER_TEMP/issue-body.md"
            else
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
            fi
          fi

      - name: Upload test results
        if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: api-update-test-results
          path: ${{ runner.temp }}/TestResults/
          if-no-files-found: ignore
