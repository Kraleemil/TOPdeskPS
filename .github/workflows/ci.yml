name: CI

on:
  push:
    branches: [Development, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pester (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            id: windows-powershell
            os: windows-latest
            shell: powershell
          - name: PowerShell 7 on Windows
            id: pwsh-windows
            os: windows-latest
            shell: pwsh
          - name: PowerShell 7 on Linux
            id: pwsh-linux
            os: ubuntu-latest
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          if ($PSVersionTable.PSVersion.Major -le 5) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # The test suite uses Pester 4 syntax.
          Install-Module -Name Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name PSFramework -Force -Scope CurrentUser
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Get-Module -ListAvailable Pester, PSFramework, PSScriptAnalyzer | Format-Table Name, Version

      - name: Run tests
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          Import-Module PSFramework
          $PSVersionTable | Format-Table -AutoSize
          ./TOPdeskPS/tests/pester.ps1 -OutputPath ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.id }}
          path: TestResults/
          if-no-files-found: ignore

  generated-code:
    name: Generated code and docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check generated commands and the coverage report
        run: |
          python -m pip install --quiet pyyaml
          # Uses the committed specs in build/apigen/specs; fails if generated files differ from them.
          python build/apigen/apigen.py check

      - name: Check the command reference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSFramework -Force -Scope CurrentUser
          ./build/New-TdCommandDoc.ps1
          $changes = git status --porcelain -- docs/commands
          if ($changes) {
            $changes
            git --no-pager diff --stat -- docs/commands
            throw 'docs/commands is out of date. Run ./build/New-TdCommandDoc.ps1 and commit the result.'
          }
