swagger: '2.0'
info:
  version: 1.0.0
  title: Knowledge Base API
  description: Retrieve entities related to the knowledge base
basePath: /tas/api/knowledgeBase
tags:
  - name: public
    description: 'Endpoints for the public realm, i.e. meant for Self-Service Portal users'
  - name: read
    description: 'Endpoints that allow you to *read* data, not manipulate it'
schemes:
  - http
paths:
  /public:
    post:
      tags:
        - public
        - read
      description: >
        Retrieve a list of knowledge items available to users of the
        Self-Service Portal. This is a GraphQL endpoint, which means the
        response object is fully determined by a user-provided string that
        describes:

        - which attributes to retrieve

        - which filters to apply


        See below for the format of this string. 
      consumes:
        - text/plain
      produces:
        - application/json
      parameters:
        - in: body
          name: query
          description: >
            Describes the query to execute, according to the GraphQL spec (see
            also documentation above).
            <br><br>
            **Entities**

            - knowledgeItems

            -- id: the unique identifier for the knowledge item

            -- number: the human readable identifier, e.g. 'KI 0001'

            -- translations: translations for the knowledge item


            - KnowledgeItemTranslations

            -- id: the unique identifier for the translations

            -- languageId: the unique identifier for the language of the
            translation

            -- knowledgeItemId: the unique identifier for the knowledge item
            this translation belongs to

            -- title: the title of the knowledge item in this translation

            -- description: the (plain-text) description of the knowledge item
            in this translation

            -- content: the (plain-text) content of the knowledge item in this
            translation


            - languages

            -- id: the unique identifier of the language

            -- name: the human-readable name of the language

            -- languageCode: the ISO 639-1 language code


            **Filters**

            - KnowledgeItems

            -- search

            --- term: the search term
          required: true
          schema:
            $ref: '#/definitions/GraphQLQuery'
      responses:
        '200':
          description: A list of knowledge items
          schema:
            $ref: '#/definitions/EnvelopedResults'
        '400':
          description: >
            General error response - see the message for a description:

            - Validation error of type FieldUndefined => the requested attributes
            that are listed do not actually exist

            - Validation error of type SubSelectionRequired => you need to
            specify at least one attribute for each entity requested

            - Validation error of type FieldsConflict => you requested the same
            entity twice with different attributes

            - Empty string is an invalid search term => you used an
            empty string as a search term. This is not allowed.

            - Invalid syntax => your query string is malformed. 
        '403':
          description: The user requesting the knowledge items is not an SSP user
definitions:
  GraphQLQuery:
    type: string
    format: GraphQL
    example: >-
      query {
        knowledgeItems(search: {term: "printer"}) {
          id number translations {
            id languageId knowledgeItemId title description content
          }
        }
        languages {
          id name languageCode
        }
      }
  EnvelopedResults:
    type: object
    properties:
      results:
        type: object
        properties:
          knowledgeItems:
            type: array
            items:
              $ref: '#/definitions/KnowledgeItem'
          languages:
            type: array
            items:
              $ref: '#/definitions/Language'
  KnowledgeItem:
    type: object
    properties:
      id:
        type: string
        format: uuid
      number:
        type: string
        description: >-
          human-readable identifier for the knowledge item, typically something
          like 'KI 0001'
      translations:
        type: array
        items:
          $ref: '#/definitions/KnowledgeItemTranslation'
        description: translations for this knowledge item
  KnowledgeItemTranslation:
    type: object
    properties:
      id:
        type: string
        format: uuid
      languageId:
        type: string
        format: uuid
        description: Identifier of the language this translation is in
      knowledgeItemId:
        type: string
        format: uuid
        description: Identifier of the knowledge item this translation belongs to
      title:
        type: string
        description: Title of the knowledge item in this translation
      description:
        type: string
        description: >-
          A plain-text short description of the knowledge item in this
          translation
      content:
        type: string
        description: The plain-text content of the knowledge item in this translation
  Language:
    type: object
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
        description: The human-readable name of the language (e.g. "English")
      languageCode:
        type: string
        description: The ISO 639-1 language code (e.g. "en")
externalDocs:
  description: Find out more about GraphQL
  url: 'http://graphql.org'
