  ListOfOrderedItems:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/OrderedItem'
      currencyPrefix:
        type: string
        example: "€"
      currencySuffix:
        type: string
        example: "EUR"

  OrderedItem:
    type: object
    properties:
      name:
        description: The name of the item.
        type: string
        example: "Smartphone"
      type:
        description: The type of the item.
        $ref: '#/definitions/NameWrapper'
      manufacturer:
        description: The manufacturer of the item.
        $ref: '#/definitions/NameWrapper'
      model:
        description: The model of this item.
        $ref: '#/definitions/NameWrapper'
      specification:
        description: The specification of the item.
        type: string
        example: "A phone which can connect to Wifi and has mobile internet."
      amount:
        description: The amount of ordered items.
        type: integer
        format: int32
        minimum: 1
        example: 3
      price:
        description: The price of one item.
        type: number
        format: float
        example: 200.50

  ManagerAction:
    type: object
    required: [action]
    properties:
      action:
        description: Whether this action is an approval or rejection.
        type: string
        enum:
          - go
          - no_go
        example: go
      reason:
        description: In case of a no_go action, the id of a rejection reason can be provided.
        type: string
        format: uuid
        example: 0756c5cd-921c-4an3-a4a5-403f20f1a067
      comment:
        description: Optionally a comment can be provided when approving or disapproving an activity.
        type:  string
        example: I think this is really important

  Requester:
    type: object
    required: [id, identifier]
    description: Either `id`, `identifier` or `name` is required. If `id` is set the identifier will be ignored.
      If neither `id` nor `identifier` is set, an unregistered requester is created with the given `name` and `branch`.
      Creating an unregistered requester is only allowed when unregistered callers are enabled in the caller block.
    properties:
      id:
        description: The UNID (Unique ID)
        type: string
        format: uuid
        example: a113342d-89b7-4c02-957c-af75c0505fd1
      identifier:
        description: The UNID (Unique ID), email or compound name of the requester. Email or compound name have to be unique.
        type: string
        example: example@example.com
      name:
        description: The name of an unregistered requester. Only used when neither `id` nor `identifier` is set.
        type: string
        example: John Doe
      branch:
        description: UUID or name of the branch of the requester. Required for an unregistered requester, overrides the branch of a registered requester.
          The branch must exist, may not be archived and has to be accessible according to the branch filters of the operator.
        type: string
        example: Delft
      location:
        description: UUID or name of the location of the requester. Has to belong to the branch of the requester, may not be archived
          and has to be accessible according to the branch filters of the operator.
          Can only be provided when the location is visible in the caller block, and not for registered requesters when their location is read-only.
        type: string
        example: Meeting room 1
      email:
        description: Email address of the requester. Can only be provided when the email address is visible in the caller block.
        type: string
        example: john.doe@example.com
      phoneNumber:
        description: Phone number of the requester. Can only be provided when the phone number is visible in the caller block.
        type: string
        example: "+31 15 2700900"

  MinimalOperatorChange:
    type: object
    required: [requester]
    properties:
      template:
        description: JSON object containing information about a template
        $ref: '#/definitions/MinimalOperatorTemplate'
      requester:
        description: JSON object containing ID of a change creator.
        $ref: '#/definitions/Requester'
      briefDescription:
        description: Brief description of a created change.
        type: string
        maxLength: 80
        example: "Smartphone broken"
      request:
        description: The request of the change
        type: string
        example: "Dean reported that his smartphone is broken. We need to order new ones."
      action:
        description: The action of the change
        type: string
        example: "I ordered 5 new smartphones."
      actionInvisibleForCaller:
        description: Whether the initial action is invisible for persons.
        type: boolean
        required: false
        example: false
      changeType:
        description: Type of a created change.
        type: string
        enum:
          - simple
          - extensive
        example: extensive
      phases:
        description: The authorizer for each phase. Preliminary Request for Change and Evaluation is optional and will not be created when not provided.
          The authorizers for the different phases will override the values from the template. When no authorizer is provided the values from the template will be used.
        $ref: "#/definitions/MinimalChangePhases"
      simple:
        description: Here the assignee for the simple change can be supplied
        $ref: '#/definitions/MinimalSimplePhase'
      externalNumber:
        description: External number of the change
        type: string
        example: "E1103"
      category:
        description: UUID or name of the category
        type: string
        example: Software
      subcategory:
        description: UUID or name of the subcategory. It must match with the provided category or the category of the template
        type: string
        example: TOPdesk
      location:
        description: UUID or name of the location. The branch of the change will be set to the branch of the location.
          Can only be provided with a license for locations and when object/location is visible for requests for change.
          Archived locations and locations of branches that are not accessible according to the branch filters of the operator are not allowed.
        type: string
        example: Meeting room 1
      object:
        description: UUID or number of object or UUID of asset. Cannot be provided together with location. Can only be provided 
          when object/location is visible for requests for change. Archived objects are not allowed.
        type: string
        example: LAP-0815
      type:
        description: UUID or name of the type of the change. Can only be provided when the type is visible for requests for change.
          Archived types are not allowed.
        type: string
        example: Standard change
      supplier:
        description: UUID or name of the supplier. Can only be provided for simple changes and when the supplier is visible for simple changes.
          Archived suppliers are not allowed.
        type: string
        example: Hardware supplier
      coordinator:
        description: UUID or name of the coordinator. Has to be an operator or operator group with the change coordinator task.
          Archived operators and operator groups are not allowed.
        type: string
        example: Change coordinators
      emergencyChange:
        description: Whether the change is an emergency change.
        type: boolean
        example: false
      benefit:
        description: UUID or name of the benefit
        type: string
        example: Cost Savings
      impact:
        description: UUID or name of the impact
        type: string
        example: Branch
      priority:
        description: UUID or name of the priority
        type: string
        example: Low
      optionalFields1:
        $ref: '#/definitions/OptionalFieldsForWriting'
      optionalFields2:
        $ref: '#/definitions/OptionalFieldsForWriting'

  OperatorChangeDetails:
    type: object
    required: [id, requester, briefDescription, changeType]
    properties:
      id:
        description: UNID (Unique ID) of a created change.
        type: string
        format: uuid
        example: a113342d-89b7-4c02-957c-af75c0505fd1
      number:
        type: string
        description: The number of the created change
        example: C 1604 0003
      briefDescription:
        description: Brief description of a created change
        type: string
        example: "Description of a change"
      branch:
        description: The branch linked to the location linked to the change.
        $ref: '#/definitions/NameIdPair'
      templateId:
        description: UNID (Unique ID) of the template the change is based on.
        type: string
        format: uuid
        example: a113342d-89b7-4c02-957c-af75c0505fd1
      type:
        description: The userdefined type of this change.
        $ref: '#/definitions/NameIdPair'
      requester:
        description: JSON object containing name and id of a change creator.
        $ref: '#/definitions/ChangeRequester'
      archived:
        description: If the change is archived or not.
        type: boolean
        example: false
      changeType:
        description: Type of a created change.
        type: string
        enum:
          - simple
          - extensive
        example: simple
      requestDate:
        description: |
          The date when this change was requested. This might differ if for example a change is requested over weekend
          but only entered in topdesk the next Monday.
        type: string
        format: 'date-time'
        example: "2018-04-23T10:09:00+0000"
      creationDate:
        description: The date when this change was created in the database.
        type: string
        format: 'date-time'
        example: "2018-04-23T10:09:00+0000"
      lastModificationDate:
        description: The date when this change was last modified in the database.
        type: string
        format: 'date-time'
        example: "2018-04-23T10:09:00+0000"
      emergencyChange:
        description: Indicates if this change is an emergency change or not.
        type: boolean
        example: false
      processingStatus:
        description: The current processing status of the change. 'prfc' means Preliminary Request for Change, 'rfc' means Request for Change.
        type: string
        enum:
          - prfc
          - rfc
          - rejected
          - extensive_notStarted
          - extensive_inProgress
          - extensive_done
          - extensive_evaluating
          - extensive_evaluated
          - extensive_closed
          - extensive_nogo
          - extensive_cancelled
          - simple_notStarted
          - simple_inProgress
          - simple_done
          - simple_closed
        example: simple_notStarted
      costs:
        description: The costs of this change. At the moment only simple changes are supported.
        $ref: '#/definitions/Costs'
      possibleActions:
        description: The actions possible in the current processingStatus.
        type: array
        items:
          type: string
        example:
          - submit
          - reject
      coordinator:
        description: The coordinator of the change.
        $ref: '#/definitions/TransitionPerformer'
      phases:
        description: Dates and Authorizers for this changes phases.
        $ref: '#/definitions/ChangePhasesForDetailsEndpoint'
      simple:
        description: |
          Contains the planned and achieved dates and assignee for simple changes. If this is an extensive change simple
          will be null.
        $ref: '#/definitions/SimpleChangeData'
      canceled:
        description: If it's a canceled extensive change, details about who canceled it and why. Null otherwise.
        type: object
        properties:
          cancelDate:
            type: string
            format: date-time
            description: When this change was canceled.
          canceledBy:
            type: object
            description: Details of who canceled this change.
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              type:
                type: string
                enum:
                  - operator
                  - manager
          reason:
            type: object
            $ref: '#/definitions/NameIdPair'
            description: The reason why this change was canceled. (if given, null otherwise)

      externalNumber:
        type: string
        example: "E1103"
      object:
        description: Linked Object
        $ref: '#/definitions/ConfigurationObjectDetailed'
      asset:
        description: Linked Asset
        $ref: '#/definitions/Id'
      location:
        description: Linked location
        $ref: '#/definitions/NameIdPair'
      requests:
        description: Link to the endpoint that contains the full data of the requests, including html and images
        type: string
        example: "/tas/api/operatorChanges/30309d1d-5753-420b-b9f7-fabfb2525f8d/requests"
      progressTrail:
        description: Link to the endpoint that contains the full data of the progress trail, including html and images
        type: string
        example: "/tas/api/operatorChanges/30309d1d-5753-420b-b9f7-fabfb2525f8d/progresstrail"
      impact:
        description: The impact of the change
        $ref: '#/definitions/NameIdPair'
      benefit:
        description: The benefit of the change
        $ref: '#/definitions/NameIdPair'
      priority:
        description: The priority of the change
        $ref: '#/definitions/NameIdPair'
      category:
        description: The category of the change
        $ref: '#/definitions/NameIdPair'
      subcategory:
        description: The subcategory of the change
        $ref: '#/definitions/NameIdPair'
      status:
        description: The status of the change
        $ref: '#/definitions/NameIdPair'
      optionalFields1:
        $ref: '#/definitions/OptionalFields'
      optionalFields2:
        $ref: '#/definitions/OptionalFields'

  Costs:
    type: object
    properties:
      value:
        type: number
        format: decimal
        example: 200.53
      currencyPrefix:
        type: string
        example: "€"
      currencySuffix:
        type: string
        example: EUR

  MinimalChangePhases:
    type: object
    properties:
      prfc:
        description: Details about the prfc phase. Will be empty if prfcs are disabled.
        $ref: '#/definitions/MinimalChangePhase'
      rfc:
        description: Details about the rfc phase.
        allOf:
          - $ref: '#/definitions/MinimalChangePhase'
          - type: object
            properties:
              plannedEndDate:
                description: The planned end date for this phase.
                type: string
                format: date-time
                example: "2026-07-01T12:55:00+0000"
      progress:
        description: Details about the progress phase.
        $ref: '#/definitions/MinimalChangePhase'
      evaluation:
        description: Details about the evaluation phase.
        $ref: '#/definitions/MinimalChangePhase'

  MinimalChangePhase:
    type: object
    properties:
      authorizer:
        description: The manager or operator that is supposed to authorize the phase.
        $ref: '#/definitions/AssigneeDetails'
  MinimalSimplePhase:
    type: object
    properties:
      authorizer:
        description: The manager or operator that is supposed to authorize the phase.
        $ref: '#/definitions/AssigneeDetails'
      plannedStartDate:
        description: Planned start date. Must not be in the past.
        type: string
        format: date-time
        example: "2026-07-01T12:55:00+0000"
      plannedImplementationDate:
        description: Planned implementation date. Must not be before the plannedStartDate.
        type: string
        format: date-time
        example: "2026-07-01T12:55:00+0000"

  ChangePhaseEndDate: &phasesEndDate
    type: string
    format: date-time
    description: The date when the phase has ended, if it has ended. Null if the phase has not yet ended.
    example: "2018-04-23T10:09:00+0000"

  ChangePhasePlannedEndDate: &phasesPlannedEndDate
    type: string
    format: date-time
    description: The planned end date of the phase.
    example: "2018-04-23T10:09:00+0000"

  ChangePhaseRejectedDate: &phasesRejectedDate
    description: The date when this change was set to rejected.
    type: string
    format: 'date-time'
    example: "2018-04-23T10:09:00+0000"

  ChangePhaseNoGoDate: &phasesNoGoDate
    description: The date when this change was set to nogo.
    type: string
    format: 'date-time'
    example: "2018-04-23T10:09:00+0000"

  ChangePhaseAuthorizer:
