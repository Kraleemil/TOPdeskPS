  UpdateStep:
    type: object
    required:
      - op
      - path
    properties:
      op:
        type: string
        enum:
          - add
          - remove
          - replace
          - move
          - copy
          - test
        example: add
        description: The update operation to take. See https://tools.ietf.org/html/rfc6902 for more details.
      path:
        type: string
        description: The field to update/test/remove, specified as JSON Pointer (https://tools.ietf.org/html/rfc6901).
        example: /progressTrail
      value:
        type: object
        description: |
          The new value when replacing or adding, the comparison value when testing.
          (Can be a string literal or a json object.)
        example: This is a memo text
      from:
        type: string
        description: The source of the copy or move action, specified as JSON Pointer (https://tools.ietf.org/html/rfc6901).
