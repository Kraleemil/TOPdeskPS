          description: The authorization activity was not found

  /managerAuthorizableActivities/{id}/managerAction:
    put:
      tags:
        - Manager Authorizations
      summary: Approves or rejects an authorization activity.
      description: Approves or rejects an authorization activity.
      consumes:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the authorization activity.
          in: path
          type: string
          required: true
          format: uuid
        - name: Manager Action
          in: body
          required: true
          description: A JSON object containing details of the manager action.
          schema:
            $ref: '#/definitions/ManagerAction'
      responses:
        '204':
          description: The authorization action was successful
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to authorize activity
        '404':
          description: The authorization activity was not found

  /managerAuthorizableActivities/{id}/progresstrail:
    get:
      tags:
        - Manager Authorizations
      summary: Returns the progress trail of this activity.
      description: The returned entries can be memos, links or attachments.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the authorization activity.
          in: path
          type: string
          required: true
          format: uuid
        - name: inlineimages
          description: Whether inline images should be returned.
          in: query
          type: boolean
          default: false
        - name: browserFriendlyUrls
          description: |
            Normal download urls are api urls and require a token header. This parameter causes the api to return
            urls that can be accessed by the current user by having a regular session like most web browsers do.
            These download links are valid for one hour.
          in: query
          type: boolean
          default: false
        - name: type
          description: |
            Allows for requesting only specific types of progress trail entries.
          in: query
          type: array
          collectionFormat: multi
          items:
            type: string
            enum: [memo, attachment, link]
          default: [memo, attachment, link]
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfPublicProgressTrailEntries'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access authorization activity
        '404':
          description: The authorization activity was not found
    post:
      tags:
        - Manager Authorizations
      summary: Creates a new action for this activity.
      description: |
        When the `textFormatting` is set to `html`, some html tags can be used for formatting. 
        But if not specified, the default formatting is `plain` which will treat everything as text. 
        All whitespace characters will be trimmed at the start and end of the text. 
        The created action is returned by the endpoint.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the activity.
          in: path
          type: string
          required: true
          format: uuid
        - name: body
          in: body
          required: true
          description: A JSON object containing the type of the progress trail entry (Only 'memo' is supported at this moment) and the text of the action.
          schema:
            $ref: '#/definitions/MinimalProgressTrailEntry'
      responses:
        '201':
          description: Success
          schema:
            $ref: '#/definitions/MemoEntry'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to create a new action for this activity
        '404':
          description: The activity was not found
        '415':
          description: Unsupported Media type

  /managerAuthorizableActivities/{entityId}/attachments/{attachmentId}:
    get:
      tags:
        - Manager Authorizations
      summary: Downloads the given attachment of an activity.
      parameters:
        - name: entityId
          description: The UNID (Unique ID) of the activity of this attachment.
          in: path
          type: string
          required: true
          format: uuid
        - name: attachmentId
          description: The UNID (Unique ID) of this attachment.
          in: path
          type: string
          required: true
          format: uuid
      responses:
        '200':
          description: Success
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access authorization activity
        '404':
          description: The authorization activity or attachment was not found
        '500':
          description: There was an error while fetching this attachment

  /managerAuthorizableActivities/{id}/attachments:
    post:
      tags:
        - Manager Authorizations
      summary: Uploads a file as an attachment to this activity.
      description: |
        Uploads a file as an attachment to this activity.
        Returns the created progress trail entry in case of success.

        Be aware that this endpoint consumes multipart/form-data. More information about this format can be found on https://tools.ietf.org/html/rfc7578
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the activity of this attachment.
          in: path
          type: string
          required: true
          format: uuid
        - name: file
          description: The attachment to upload.
          in: formData
          required: true
          type: file
      responses:
        '201':
          description: Success
          schema:
            $ref: '#/definitions/PublicProgressTrailEntry'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access activity
        '404':
          description: The activity was not found
        '415':
          description: Unsupported media type
        '500':
          description: Error while uploading the attachment

  /managerAuthorizableActivities/{id}/requests:
    get:
      tags:
        - Manager Authorizations
      summary: Lists the requests for this activity.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the authorization  activity.
          in: path
          type: string
          required: true
          format: uuid
        - name: inlineimages
          description: Whether inline images should be returned.
          in: query
          type: boolean
          default: false
        - name: browserFriendlyUrls
          in: query
          type: boolean
          description: |
            Normal download urls are api urls and require a token header. This parameter causes the api to return
            urls that can be accessed by the current user by having a regular session like most web browsers do.
            These download links are valid for one hour.
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfRequestEntries'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access authorization activity
        '404':
          description: The authorization activity was not found

  /managerAuthorizableActivities/{id}/change/progresstrail:
    get:
      tags:
        - Manager Authorizations
      summary: Returns the progress trail of the change this activity belongs to.
      description: The returned entries can be memos, links or attachments.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the change of this authorization activity.
          in: path
          type: string
          format: uuid
          required: true
        - name: inlineimages
          description: Whether inline images should be returned.
          in: query
          type: boolean
          default: false
        - name: browserFriendlyUrls
          description: |
            Normal download urls are api urls and require a token header. This parameter causes the api to return
            urls that can be accessed by the current user by having a regular session like most web browsers do.
            These download links are valid for one hour.
          in: query
          type: boolean
          default: false
        - name: type
          description: |
            Allows for requesting only specific types of progress trail entries.
          in: query
          type: array
          collectionFormat: multi
          items:
            type: string
            enum: [memo, attachment, link]
          default: [memo, attachment, link]
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfPublicProgressTrailEntries'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access authorization activity
        '404':
          description: The authorization activity or the attachment was not found

  /managerAuthorizableActivities/{id}/change/requests:
    get:
      tags:
        - Manager Authorizations
      summary: Lists the requests for the change this activity belongs to.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the parent change of this authorization activity.
          in: path
          type: string
          required: true
          format: uuid
        - name: inlineimages
          description: Whether inline images should be returned.
          in: query
          type: boolean
          default: false
        - name: browserFriendlyUrls
          in: query
          type: boolean
          description: |
            Normal download urls are api urls and require a token header. This parameter causes the api to return
            urls that can be accessed by the current user by having a regular session like most web browsers do.
            These download links are valid for one hour.
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfRequestEntries'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access authorization activity
        '404':
          description: The authorization activity was not found

  /managerAuthorizableActivities/{id}/change/attachments/{attachmentId}:
    get:
      tags:
        - Manager Authorizations
      summary: Downloads the given attachment of a parent change of an activity.
      parameters:
        - name: id
          description: The UNID (Unique ID) of the activity used to select the parent change.
          in: path
          type: string
          required: true
          format: uuid
        - name: attachmentId
          description: The UNID (Unique ID) of this attachment.
          in: path
          type: string
          required: true
          format: uuid
      responses:
        '200':
          description: Success
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access authorization activity
        '404':
          description: The authorization activity or attachment was not found
        '500':
          description: There was an error while fetching this attachment

  /changeRejectionReasons:
    get:
      tags:
        - Manager Authorizations
      summary: Lists the configured reasons for rejecting changes.
      description: Lists the configured reasons for rejecting changes.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            type: array
            items:
              $ref: '#/definitions/NameIdPair'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access rejection reasons

  /changeActivityRejectionReasons:
    get:
      tags:
        - Manager Authorizations
      summary: Lists the configured reasons for rejecting authorization activities.
      description: Lists the configured reasons for rejecting authorization activities.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            type: array
            items:
              $ref: '#/definitions/NameIdPair'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access rejection reasons

  /applicableChangeTemplates:
    get:
      tags:
        - Working as an operator
      summary: Lists all templates that can be used to create new requests for changes.
      description: |
        Templates must be marked as "Available in Request for Change" or "Available in call" to be listed here.
        If the current operator does not have permission for creating simple or extensive changes those templates will also be
        hidden.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfChangeTemplates'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access applicable change templates

  /applicableActivityTemplates:
    get:
      tags:
        - Working as an operator
      summary: Lists all activity templates that can be used to create new activities.
      description: |
        Archived activity templates are not listed. Templates are ordered by creation date, newest first.
        Normal activity templates are only listed if the current operator has permission for creating normal activities.
        Authorization activity templates are only listed if the current operator has permission for creating authorization
        activities and the authorization functionality is enabled.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfActivityTemplates'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access applicable activity templates

  /changes/settings:
    get:
      tags:
        - Working as an operator
      summary: Returns settings for changes.
      description: |
        The endpoint returns module settings for change management.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/Settings'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access applicable change settings

  /changes/changeStatuses:
    get:
      tags:
        - Searchlists
      summary: Lists all statuses for changes.
      description: |
        This endpoint returns all the statuses for changes and their meaning for the different phases.
        The values in defaultFor indicate if and for which phases this status is the default value. If the status is not the default for any phase an empty list will be returned.
        Possible values for defaultFor are prfc, rfc, simple, extensive progress and extensive evaluation.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfChangeStatuses'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access the change statuses.

  /changes/activityStatuses:
    get:
      tags:
        - Searchlists
      summary: Lists all statuses for activities
      description: |
        This endpoint returns all the statuses for activities and their meaning for normal and authorization activities.
        The values in defaultFor indicate if and for which types this status is the default value. If the status is not the default for any type an empty list will be returned.
        Possible values for defaultFor are activity and authorization activity.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfActivityStatuses'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access the activity statuses.

  /changes/benefits:
    get:
      tags:
        - Searchlists
      summary: List all benefits for changes
      description: |
        This endpoint returns all benefits for changes, and whether a given benefit is archived and/or the default value.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfChangeBenefits'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access the change benefits.

  /changes/impacts:
    get:
      tags:
        - Searchlists
      summary: List all impacts for changes
      description: |
        This endpoint returns all impacts for changes, and whether a given impact is archived and/or the default value.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfChangeImpacts'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access the change impacts.

  /changes/priorities:
    get:
      tags:
        - Searchlists
      summary: List all priorities for changes
      description: |
        This endpoint returns all priorities for changes, and whether a given priority is archived and/or the default value.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfChangePriorities'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access the change priorities.

  /changes/types:
    get:
      tags:
        - Searchlists
      summary: List all types for changes
      description: |
        This endpoint returns the `type` search list for changes: the values of a change's `type` field
        (`type.id` / `type.name`), and whether a given type is archived and/or the default value.

        This is unrelated to the `changeType` enum (`simple` / `extensive`), which distinguishes simple changes
        from extensive changes.
      produces:
        - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfChangeTypes'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access the change types.

definitions:
  Settings:
    type: object
    properties:
      processingStatusDeterminedByStatus:
        type: boolean
        example: true

  ListOfActivityStatuses:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/ActivityStatus'

  ActivityStatus:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: f197bb75-8822-45e9-82ce-02983504020b
      name:
        type: string
        example: Planned
      activity:
        type: string
        enum:
          - CURRENT_STATUS
          - READY_TO_START
          - STARTED
          - RESOLVED
          - SKIPPED
          - NOT_AVAILABLE
        example: STARTED
      authorizationActivity:
        type: string
        enum:
          - CURRENT_STATUS
          - NOT_AUTHORIZED
          - GO
          - NO_GO
          - NOT_AVAILABLE
        example: GO
      archived:
        type: boolean
        example: false
      defaultFor:
        type: array
        items:
          type: string
          enum:
            - activity
            - authorization activity
          example: activity

  ListOfChangeStatuses:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/ChangeStatus'

  ChangeStatus:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: f197bb75-8822-45e9-82ce-02983504020b
      name:
        type: string
        example: Processing
      prfc:
        type: string
        enum:
          - CURRENT_STATUS
          - NOT_SUBMITTED_REJECTED
          - SUBMIT
          - REJECT
          - NOT_AVAILABLE
        example: SUBMIT
      rfc:
        type: string
        enum:
          - CURRENT_STATUS
          - NOT_APPROVED_REJECTED
          - APPROVE
          - REJECT
          - NOT_AVAILABLE
        example: APPROVE
      simple:
        type: string
        enum:
          - CURRENT_STATUS
          - NOT_STARTED
          - STARTED
          - IMPLEMENTED
          - CLOSED
          - NOT_AVAILABLE
        example: IMPLEMENTED
      extensive:
        type: string
        enum:
          - CURRENT_STATUS
          - NOT_AUTHORIZED
          - GO
          - NO_GO
          - NOT_AVAILABLE
        example: GO
      archived:
        type: boolean
        example: false
      defaultFor:
        type: array
        items:
          type: string
          enum:
            - prfc
            - rfc
            - simple
            - extensive progress
            - extensive evaluation
          example: simple

  ListOfChangeBenefits:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/ChangeBenefit'

  ChangeBenefit:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: f197bb75-8822-45e9-82ce-02983504020b
      name:
        type: string
        example: Improved knowledge
      archived:
        type: boolean
        example: false
      default:
        type: boolean
        example: false

  ListOfChangeImpacts:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/ChangeImpact'

  ChangeImpact:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: f197bb75-8822-45e9-82ce-02983504020b
      name:
        type: string
        example: Department
      archived:
        type: boolean
        example: false
      default:
        type: boolean
        example: false

  ListOfChangePriorities:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/ChangePriority'

  ChangePriority:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: f197bb75-8822-45e9-82ce-02983504020b
      name:
        type: string
        example: High
      archived:
        type: boolean
        example: false
      default:
        type: boolean
        example: false

  ListOfChangeTypes:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/ChangeType'

  ChangeType:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: f197bb75-8822-45e9-82ce-02983504020b
      name:
        type: string
        example: Standard
      archived:
        type: boolean
        example: false
      default:
        type: boolean
        example: false

  ListOfChangeTemplates:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/ChangeTemplate'

  ChangeTemplate:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: a513542d-89b7-4c02-957c-af75c0505fd1
      number:
        type: string
        example: C 1604 0003
      briefDescription:
        type: string
        example: This is an example Change Template
      changeType:
        description: The type of change created from this template.
        type: string
        enum:
          - simple
          - extensive
        example: extensive
      withEvaluation:
        description: Whether changes created from this template have an evaluation phase.
        type: boolean
        example: false

  ListOfActivityTemplates:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/ActivityTemplate'

  ActivityTemplate:
    type: object
    required: [id, number, briefDescription, activityType, plannedForPhase]
    properties:
      id:
        type: string
        format: uuid
        example: a513542d-89b7-4c02-957c-af75c0505fd1
      number:
        type: string
        example: A 1234
      briefDescription:
        type: string
        example: This is an example Activity Template
      activityType:
        description: The type of activity created from this template.
        type: string
        enum:
          - normal
          - authorization
        example: normal
      plannedForPhase:
        description: The change phase in which activities created from this template are planned.
        type: string
        enum:
          - rfc
          - progress
          - evaluation
        example: rfc

  MinimalProgressTrailEntry:
    type: object
    required: [memoText, type]
    properties:
      memoText:
        type: string
        description: |
          The text of this progress trail entry, if it is of type 'memo'. 
          May not contain only whitespace characters (Spaces, New Lines, Tabs) and may not be empty. 
          When the `textFormatting` is set to `html`, the following html tags can be used to format the text:
            <ul>
            <li>&lt;i&gt;</li>
            <li>&lt;em&gt;</li>
            <li>&lt;b&gt;</li>
            <li>&lt;strong&gt;</li>
            <li>&lt;u&gt;</li>
            <li>&lt;img&gt; BASE64-encoding has to be used. Only pictures up to the size of 450x600 pixels are supported. Allowed picture-formats: gif, png, bmp, pcx, iff, ras, pnm, psd, jpg. Example: &lt;img src="data:image/png;base64,iVBORw0KGgoAAA..."&gt;</li>
            <li>&lt;br&gt;</li>
            <li>&lt;h5&gt;</li>
            <li>&lt;h6&gt;</li>
            </ul>
        example: This is the description
      textFormatting:
        type: string
        description: Tells the api if the text is supposed to be interpreted as html or plain text.
        enum:
          - plain
          - html
        default: plain
      type:
        type: string
        description: The type of this progress trail entry.
        enum:
          - memo
          - attachment
          - link
        example: memo
      invisibleForCaller:
        type: boolean
        required: false
        description: Whether this progress trail entry is invisible for callers. Can only be set by operators.
        example: false

  NameIdPair:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: a113342d-89b7-4c02-957c-af75c0505fd1
      name:
        type: string
        example: Name of item

  ChangeRequester:
    type: object
    properties:
      id:
        description: The id of the requester.
        type: string
        format: uuid
        example: a113342d-89b7-4c02-957c-af75c0505fd1
      name:
        description: The name of the requester.
        type: string
      branch:
        description: The branch of the requester as shown in the caller block of the change.
        $ref: '#/definitions/NameIdPair'
      location:
        description: The location of the requester as shown in the caller block of the change.
        $ref: '#/definitions/NameIdPair'
      budgetHolder:
        description: The budget holder as shown in the caller block of the change.
        $ref: '#/definitions/NameIdPair'
      department:
        description: The department as shown in the caller block of the change.
        $ref: '#/definitions/NameIdPair'
      email:
        description: The email of the requester.
        type: string
      phoneNumber:
        description: The phone number of the requester.
        type: string
      mobilePhoneNumber:
        description: The mobile phone number of the requester.
        type: string

  NameWrapper:
    type: object
    properties:
