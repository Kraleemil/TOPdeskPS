  /operatorChangeActivities:
    get:
      tags:
        - Working as an operator
      summary: Get a list of change activities
      description: |
        Get a list of change activities. Use the <b>fields</b> parameter to select only the fields you are interested in and filter the results with the parameter <b>query</b>.

        **/tas/api/operatorChangeActivities?query=closedDate=ge=2010-12-26T16:00:16Z;number!='C 2009 001'**

        Without specifying the `fields` parameter the legacy response (limited fields) will be returned which looks like below:
        ```json
        {
          "results": [
            {
              "id": "a113342d-89b7-4c02-957c-af75c0505fd1",
              "number": "CA 1604 0003",
              "briefDescription": "Description of a change activity",
              "change": {
                "id": "a113342d-89b7-4c02-957c-af75c0505fd1",
                "number": "C 1604 0003"
              },
              "activityType": "normal",
              "assignee": {
                "id": "a247jedd-69b7-4cbd-9dw1-af25h5g505fd1",
                "name": "Dawn Meadows",
                "groupId": "a113342d-89b7-4c02-957c-af75c0505fd1",
                "groupName": "IT Services",
                "type": "operator"
              },
              "processingStatus": "ready_to_start",
              "status": {
                "id": "a113342d-89b7-4c02-957c-af75c0505fd1",
                "name": "Name of item"
              },
              "plannedStartDate": "2018-04-23T10:09:00+0000",
              "startDate": "2018-04-23T10:09:00+0000",
              "plannedFinalDate": "2018-04-23T10:09:00+0000",
              "finalDate": "2018-04-23T10:09:00+0000",
              "archived": false,
              "creationDate": "2018-04-23T10:09:00+0000",
              "lastModificationDate": "2018-04-23T10:09:00+0000"
            }
          ],
          "next": "string"
        }
        ```
      produces:
        - application/json
      parameters:
        - name: query
          type: string
          in: query
          description: "<p>A FIQL search expression to filter the result. You cannot mix the old filtering and FIQL. If you do, the request will fail with a Bad Request (status code 400) error.

                    The FIQL query syntax is documented in the <a href=\"../tutorial.html#show-collapse-query-overview\">tutorial</a>.</p>

                    <p>The fields available for filtering are:<br>
                    <ul>
                    <li>number</li>
                    <li>change.id</li>
                    <li>change.number</li>
                    <li>operator.id</li>
                    <li>operator.name</li>
                    <li>operatorGroup.id</li>
                    <li>operatorGroup.name</li>
                    <li>manger.id</li>
                    <li>manger.name</li>
                    <li>mangerGroup.id</li>
                    <li>mangerGroup.name</li>
                    <li>status.id</li>
                    <li>status.name</li>
                    <li>blocked</li>
                    <li>open</li>
                    <li>plannedFinalDate</li>
                    <li>finalDate</li>
                    <li>archived</li>
                    <li>currentPlanCosts</li>
                    <li>remainingCosts</li>
                    <li>costs</li>
                    <li>originalPlanCosts</li>
                    <li>realizedCosts</li>
                    <li>currentPlanTimeSpent</li>
                    <li>remainingTimeSpent</li>
                    <li>originalPlanTimeSpent</li>
                    <li>timeSpent</li>
                    <li>briefDescription</li>
                    <li>activityType</li>
                    <li>assignee.id</li>
                    <li>assignee.name</li>
                    <li>assignee.groupId</li>
                    <li>assignee.groupName</li>
                    <li>assignee.type</li>
                    <li>processingStatus</li>
                    <li>plannedStartDate</li>
                    <li>startDate</li>
                    <li>lastModificationDate</li>
                    <li>template.id</li>
                    <li>template.name</li>
                    <li>approvedDate</li>
                    <li>archiveReason.id</li>
                    <li>archiveReason.name</li>
                    <li>category.id</li>
                    <li>category.name</li>
                    <li>plannedChangePhase</li>
                    <li>externalNumber</li>
                    <li>rejectedDate</li>
                    <li>rejectionReason.id</li>
                    <li>rejectionReason.name</li>
                    <li>resolvedDate</li>
                    <li>skippedDate</li>
                    <li>skippedReason.id</li>
                    <li>skippedReason.name</li>
                    <li>subcategory.id</li>
                    <li>subcategory.name</li>
                    <li>supplier.id</li>
                    <li>supplier.name</li>
                    <li>creator.id</li>
                    <li>creator.name</li>
                    <li>modifier.id</li>
                    <li>modifier.name</li>
                    <li>optionalFields1.number1 (optionalFields[1,2].number[1-5])</li>
                    <li>optionalFields1.date1 (optionalFields[1,2].date[1-5])</li>
                    <li>optionalFields1.boolean1 (optionalFields[1,2].boolean[1-5])</li>
                    <li>optionalFields1.memo1 (optionalFields[1,2].memo[1-5])</li>
                    <li>optionalFields1.text1 (optionalFields[1,2].text[1-5])</li>
                    <li>optionalFields1.searchlist1.id (optionalFields[1,2].searchlist[1-5].id)</li>
                    <li>optionalFields1.searchlist1.name (optionalFields[1,2].searchlist[1-5].name)</li>
                    </ul>
                    <p>"
          required: false
        - name: pageSize
          description: Only show this amount of activities in the results. Default is 1000, maximum is 5000.

            _This is a filter parameter_
          in: query
          type: integer
          default: 1000
          maximum: 5000
          required: false
        - name: pageStart
          description: A parameter to tell at which entry the results should start. Default is 0.

            _This is a filter parameter_
          in: query
          type: integer
          required: false
        - name: sort
          description: |
            A parameter to sort the results by. It is currently possible to sort on:
            * id
            * creationDate
            * finalDate
            * plannedFinalDate
            * plannedStartDate
            * startDate
            * lastModificationDate
            * approvedDate
            * rejectedDate
            * skippedDate
            * resolvedDate
            * activityType
            * number
            * briefDescription
            * status.name

            You can specify the direction by providing _asc_ or _desc_ separated by a colon `:` . The default is desc. Changes that do not have the field set, will always be sorted at the end.

            Sorting on `activityType` orders `normal` before `authorization` (not alphabetically).

            For example finalDate:asc
          type: string
          in: query
          required: false
          x-example: "finalDate:asc"
        - name: fields
          description: |
            This parameter allows the client to specify which fields of the ChangeActivity are present in responses.
            `fields` must be a string containing a list of supported fields separated with comma. If the keyword 'all' is used the response will contain all of the fields in the example response.
            To specify nested fields use the dot annotation. F.e. fields=status.id,optionalFields2.number3
            Note that, unknown items in the `fields` parameter will result in an error.
            If the `fields` is mentioned but it was empty, only the `id` of ChangeActivity will be returned.
            If a parameter specified more than once, it will NOT result in an error.
            If a ChangeActivity doesn't have any value for a requested field, that field will be part of response with `null` as value.
            Field names for ChangeActivity are case-sensitive.
          type: string
          in: query
          required: false
        - name: change
          description: "**DEPRECATED** use <b>query</b> parameter instead. Id or number of the parent change

            _This is a repeatable filter parameter_"
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
          required: false
        - name: operator
          description: "**DEPRECATED** use <b>query</b> parameter instead. Only show activities that are assigned to this operator. Accepts the id of the operator.

            _This is a repeatable filter parameter_"
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
          required: false
        - name: operatorGroup
          description: "**DEPRECATED** use <b>query</b> parameter instead. Only show activities that are assigned to this operator group. Accepts the id of the operator group.

            _This is a repeatable filter parameter_"
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
          required: false
        - name: archived
          type: boolean
          in: query
          description: "**DEPRECATED** use <b>query</b> parameter instead. Only show activities that are/are not archived.

            _This is a filter parameter_"
          required: false
        - name: id
          type: array
          items:
            type: string
          format: uuid
          in: query
          collectionFormat: multi
          description: "**DEPRECATED** use <b>query</b> parameter instead. Only show activities with specific ids.

            _This is a filter parameter_"
          required: false
        - name: status
          type: array
          items:
            type: string
          in: query
          collectionFormat: multi
          description: "**DEPRECATED** use <b>query</b> parameter instead. Only show activities with specific statuses. (accepts ids and names)

            _This is a filter parameter_"
          required: false
        - name: finalDateAfter
          type: string
          format: date-time
          in: query
          description: "**DEPRECATED** use <b>query</b> parameter instead. Only show activities that ended after this date.

            _This is a filter parameter_"
          required: false
        - name: blocked
          type: boolean
          in: query
          description: "**DEPRECATED** use <b>query</b> parameter instead. Only show activities that are waiting for other activities to be done.

            _This is a filter parameter_"
          required: false
        - name: open
          type: boolean
          in: query
          description: "**DEPRECATED** use <b>query</b> parameter instead. Only show activities that are open. (e.g. not resolved, skipped, approved or rejected)

            _This is a filter parameter_"
          required: false

      responses:
        '200':
          description: Success - includes all the possible fields (fields=all)
          schema:
            $ref: '#/definitions/ListOfChangeActivities'
        '206':
          description: Partial Content - exceeds (default) page size limit.
          schema:
            $ref: '#/definitions/ListOfChangeActivitiesWithNextLink'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission for reading activities
        '404':
          description: No such endpoint
    post:
      tags:
        - Working as an operator
      summary: Create a new change activity
      description: |
        Also triggers Events and Actions. Note! Actions that require user interaction like "Confirm before sending" or "Editable before sending" will not be executed.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: Minimal Operator Activity
          required: true
          description: |
            Create a new change activity. Mandatory field when creating an activity **without** a template: changeId, briefDescription, activityType, changePhase, status

            You always have to provide a changeId. All other fields can also be filled via an activity template. If you provide additional values that are already set in the template, the provided values will overwrite the template values.
            **One exception**: request and action field will contain the combined values from template and provided values.
            The requests and action fields allow **only text** as value.
            If you do not supply a plannedStartDate either now (if the changePhase is the currentPhase) or the plannedStartDate of the phase (if the activity is added for a future phase) is used.
            If no status is provided the default status will be filled in automatically. If **status determines processing status** is turned on you can not provide a status.

            It is not possible to use archived templates.
          in: body
          schema:
            $ref: '#/definitions/MinimalOperatorActivity'
      responses:
        '201':
          description: Success
          schema:
            $ref: '#/definitions/ChangeActivityDetails'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to create (this type of) change activity
        '415':
          description: Unsupported media type

  /operatorChangeActivities/{identifier}:
    patch:
      tags:
        - Working as an operator
      summary: Updates change activities
      description: |
        The list of updates will be applied as one operation. That means if one of the updates fails, none of the steps will be applied.

        Also triggers Events and Actions. Note! Actions that require user interaction like "Confirm before sending"
        or "Editable before sending" will not be executed.

        When *status determines processing status* is enabled the path /processingStatus throws an error when used.
      consumes:
        - application/json-patch+json
      parameters:
        - name: identifier
          in: path
          description: Id or name of the activity to modify
          type: string
          x-example: 0774c5cd-921c-4aa3-a4a5-400f20f1a067
          required: true
        - name: List of updates to apply
          required: true
          description: |
            A json list of update steps that should be applied to a change activity. The update steps follow
            https://tools.ietf.org/html/rfc6902.
            The updatable fields are:
            - "/briefDescription"
            - "/requests"
            - "/progressTrail"
            - "/processingStatus"
            - "/activityType"
            - "/category"
            - "/subcategory"
            - "/status"
            - "/operator"
            - "/assignee"
            - "/assignee/type"
            - "/assignee/id"
            - "/assignee/groupId"
            - "/plannedStartDate"
            - "/plannedFinalDate"
            - "/externalNumber"
            - "/optionalFields[1-2]/(number|text|boolean|date|searchlist)[1-5]"
            - "/optionalFields[1-2]/memo[1-5]" (add operation)


            The requests and progressTrail allows **only text** as value. The only operation possible for requests and progressTrail is add.
            Remove with /plannedStartDate or /plannedFinalDate is not supported.

            The value "not_started" for processingStatus resets the activity (if this is possible). All the checkboxes on the activity card will be unticked.

            Possible values for "/processingStatus" are:

            "started"|"skipped"|"resolved"

            "approved"|"rejected"

            "not_started"

            When *status determines processing status* is enabled the /processingStatus field is ignored.
          in: body
          schema:
            type: array
            items:
              $ref: '#/definitions/UpdateStep'
            example:
              - op: add
                path: /progressTrail
                value: This is a memo text
              - op: remove
                path: /operator
              - op: replace
                path: /processingStatus
                value: approved
              - op: test
                path: /operator
                value: the operator to test for
      responses:
        '204':
          description: Success
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '404':
          description: No such activity
        '403':
          description: No permission for modifying this activity
        '415':
          description: Unsupported Media type

    get:
      tags:
        - Working as an operator
      summary: Returns details of a change activity
      description: |
        Returns the details of the change activity provided in the path
      produces:
        - application/json
      parameters:
        - name: identifier
          description: UNID (Unique ID) of the activity.
          type: string
          in: path
          required: true
          x-example: 0774c5cd-921c-4aa3-a4a5-400f20f1a067
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ChangeActivityDetails'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission for reading activities
        '404':
          description: No such activity


