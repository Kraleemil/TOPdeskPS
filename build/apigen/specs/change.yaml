  MinimalOperatorTemplate:
    type: object
    description: |
      Either id or number has to be set. If both of them are set, then only the id will be taken into account.
      Id is always unique. Under some special circumstances uniqueness of the number can not be guaranteed.
    properties:
      id:
        description: UNID (Unique ID) of a template
        type: string
        format: uuid
        example: a113342d-89b7-4c02-957c-af75c0505fd1
      number:
        description: Number of a template
        type: string
        example: C 1604 0003
      optionalActivities:
        description: |
          List of optional activities. The activities can be specified by id or number. An empty field (aka null-pointer)
          will cause all optional activities to be applied, an empty list will cause no optional activities to be
          applied.
        type: array
        items:
          type: string
        example:
          - A 001
          - A 002
          - A 005

  CalendarDetails:
    type: object
