        description: Link to the endpoint that contains the full data of the progress trail, including html and images
        type: string
        example: "/tas/api/operatorChangeActivities/30309d1d-5753-420b-b9f7-fabfb2525f8d/progresstrail"
      optionalFields1:
        $ref: '#/definitions/OptionalFields'
      optionalFields2:
        $ref: '#/definitions/OptionalFields'

  MinimalOperatorActivity:
    type: object
    required: [changeId]
    properties:
      activityTemplate:
        description: UUID or number of the activity template
        type: string
        example: "a113342d-89b7-4c02-957c-af75c0505fd1"
      changeId:
        description: UUID or number of the change the activity should belong to
        type: string
        example: "C 1804 017"
      briefDescription:
        description: The brief description of the activity.
        type: string
        maxLength: 80
        example: "Brief new colleagues about new GDPR regulations"
      activityType:
        description: The type of the activity (normal or authorization).
        type: string
        enum:
          - normal
          - authorization
        example: normal
      changePhase:
        description: The phase of the change this activity should be added to.
        type: string
        enum:
          - rfc
          - progress
          - evaluation
        example: progress
      plannedStartDate:
        description: The planned start date of the activity.
        type: string
        format: date-time
        example: "2018-04-25T10:00:00+0000"
      plannedFinalDate:
        description: The planned final date of the activity.
        type: string
        format: date-time
        example: "2018-04-25T11:00:00+0000"
      assignee:
        description: The assignee of the activity.
        $ref: '#/definitions/AssigneeDetails'
      status:
        description: The user defined status of the activity. Accepts id or name of the status.
        type: string
        example: "Planned"
      category:
        description: The user defined category of the activity. Accepts id or name of the category.
        type: string
        example: "HR Services"
      subcategory:
        description: The user defined subcategory of the activity. Accepts id or name of the subcategory.
        type: string
        example: "Company Policy"
      request:
        description: The description of the activity.
        type: string
        example: "Make sure everybody knows how we handle personal data."
      action:
        description: An action that will be added to the activity.
        type: string
        example: "Create a handout."
      actionInvisibleForCaller:
        description: Whether the initial action is invisible for persons.
        type: boolean
        required: false
        example: false
      optionalFields1:
        $ref: '#/definitions/OptionalFieldsForWriting'
      optionalFields2:
        $ref: '#/definitions/OptionalFieldsForWriting'

  AssigneeDetails:
    type: object
    properties:
      id:
        description: The UUID of the assignee. This refers to the Operator/Manager field.
        type: string
        format: uuid
        example: "a113342d-89b7-4c02-957c-af75c0505fd1"
      groupId:
        description: The id of the manager or operator group. Operator groups are only allowed for simple changes and normal activities.
          This refers to the Operator/Manager group field.
        type: string
        format: uuid
        example: "a247jedd-69b7-4cbd-9dw1-af25h5g505fd1"
      type:
        description: The type of the assignee. For normal activities and the rfc phase only operator is possible.
          In the prfc phase only managers are allowed.
        type: string
        enum:
          - manager
          - operator
        example: operator

  AssigneeDetailsIncludingNames:
    type: object
    properties:
      id:
        description: The UUID of the assignee.
        type: string
        format: uuid
        example: "a247jedd-69b7-4cbd-9dw1-af25h5g505fd1"
      name:
        description: The name of the assignee.
        type: string
        example: "Dawn Meadows"
      groupId:
        description: The id of the manager or operator group. Operator groups are only allowed for normal change activities.
        type: string
        format: uuid
        example: "a113342d-89b7-4c02-957c-af75c0505fd1"
      groupName:
        description: The name of the group.
        type: string
        example: "IT Services"
      type:
        description: The type of the assignee. For normal activities only operator is possible.
        type: string
        enum:
          - manager
          - operator
        example: operator

  PossibleStatusValues:
    type: object
    properties:
      notStarting:
        description: The statuses that will reset the change to not started.
        type: array
        items:
          $ref: '#/definitions/NameIdPair'
        example:
          - planned
      starting:
        description: The statuses that will move this change to started.
        type: array
        items:
          $ref: '#/definitions/NameIdPair'
        example:
          - started
      implementing:
        description: The statuses that will move this change to implemented.
        type: array
        items:
          $ref: '#/definitions/NameIdPair'
        example:
          - processing
          - waiting on supplier
      closing:
        description: The statuses that will move this change to closed.
        type: array
        items:
          $ref: '#/definitions/NameIdPair'
        example:
          - done

  ChangeActivityParent:
    type: object
    properties:
      id:
        description: The UNID (Unique ID) of the change.
        type: string
        format: uuid
        example: a113342d-89b7-4c02-957c-af75c0505fd1
      number:
        description: The number of the change
        type: string
        example: C 1604 0003

  OptionalFields:
    description: The enabled optional fields.
    type: object
    properties:
      boolean1:
        description: One of five possible boolean fields
        type: boolean
        example: true
      number1:
        description: One of five possible number fields
        type: integer
        example: 54
      text1:
        description: One of five possible text fields
        type: string
        example: "this is some text"
      memo1:
        description: One of five possible memo fields
        type: string
        example: "26-02-2016 08:44 [GMT +1:00] Meadows, D. Sr.: \nMemo1"
      date1:
        description: One of five possible date fields
        type: string
        format: 'date-time'
        example: "2015-11-25T08:58:47+0000"
      searchlist1:
        description: One of five possible searchlist fields. Currently the name of the dropdown item will not be displayed.
        $ref: '#/definitions/NameIdPair'

  OptionalFieldsForWriting:
    description: The enabled optional fields.
    type: object
    properties:
      boolean1:
        description: one of five possible boolean fields
        type: boolean
        example: true
      number1:
        description: one of five possible number fields
        type: integer
        example: 54
      text1:
        description: one of five possible text fields
        type: string
        example: "this is some text"
      memo1:
        description: one of five possible memo fields
        type: string
        example: "26-02-2016 08:44 [GMT +1:00] Meadows, D. Sr.: \nMemo1"
      date1:
        description: one of five possible date fields
        type: string
        format: 'date-time'
        example: "2015-11-25T08:58:47.863+0000"
      searchlist1:
        description: |
          One of five possible searchlist fields. You can either specify the uuid of the searchlist entry or the name.
          But if the name is specified, it has to be unique across all optional searchlists. (Even those belonging to
          other cards.)
        type: string
        example: a948a503-7b29-4dd5-9ccf-073e3657a3da

  SearchlistDto:
    type: object
    properties:
      searchlistValues:
        type: array
        items:
          $ref: '#/definitions/NameIdPair'

  IdentifiableDto:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: "e149d79a-86a2-41a8-bc53-a7a76b9b35e4"

  OrderedItemResultDto:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: "f56eb212-1c90-4646-9bdf-33c95dee1591"
      name:
        description: The name of the item.
        type: string
        example: "Smartphone"
      amount:
        description: The amount of the item ordered.
        type: integer
        format: int32
        minimum: 1
        example: 3
      price:
        description: The price of one item.
        type: number
        format: decimal
        example: 200.50

  OrderedItemDto:
    type: object
    properties:
      id:
        type: string
        format: uuid
        example: "3f8f9e9d-0c08-42a0-afbf-d0e9c7a06b47"
      amount:
        description: The amount to order for the item.
        type: integer
        format: int32
        minimum: 1
        example: 5

  NameIdPairList:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/NameIdPair'

  OrderedItemResultList:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/OrderedItemResultDto'

  Canceled:
    type: object
    properties:
      cancelDate:
        description: Cancel date
        type: string
        format: date-time
        example: "2018-04-23T10:09:00+0000"

  ChangeCancelOptionsDto:
    type: object
    properties:
      canceledById:
        type: string
        format: uuid
        description: |
          Id of an operator or a person. If this id represents operator then the operator needs to have `Extensive Change Operator` task assigned.
          If id represents person that person needs to be a manager.
      cancelDate:
        type: string
        format: date-time
        description: |
          Effective date of change cancellation
      cancelReason:
        type: string
        description: |
          Reason for cancellation. Can be either reason's id or name
      action:
        type: string
        description: |
          Additional information regarding the cancellation. Will be added to progress-trail

  ArchiveOptionsDto:
    type: object
    properties:
      archiveReason:
        type: string
        description: |
          Reason for archiving. Can be either reason's id or name.

  UnarchiveOptionsDto:
    type: object
    properties:
      unarchiveActivities:
        type: boolean
        default: false
        description: |
          Also unarchive activities of change.
