      timeSpent:
        type: integer
        format: int64
        description: The amount of time spent, in minutes.
        example: 120
      note:
        type: string
        example: Some note about this time registration entry
      entryDate:
        type: string
        format: date-time
        example: "2018-04-23T10:09:00+0000"
      operator:
        $ref: '#/definitions/NameIdPair'
      operatorGroup:
        $ref: '#/definitions/NameIdPair'
      reason:
        $ref: '#/definitions/NameIdPair'

  TimeRegistrationCreate:
    type: object
    required: [timeSpent]
    properties:
      timeSpent:
        type: integer
        format: int64
        description: The amount of time spent, in minutes. Must be a non-zero value, and may not make the total registered time on the change negative.
        example: 120
      note:
        type: string
        description: Depending on the settings, this field can be mandatory.
        example: Some note about this time registration entry
      entryDate:
        type: string
        format: date-time
        description: Defaults to the current date and time when not provided.
        example: "2018-04-23T10:09:00+0000"
      operator:
        type: string
        description: The operator to register the time for. Accepts UUID or name. Defaults to the currently logged in operator when not provided. Registering time for another operator requires the `Time registration for other operators` permission.
      operatorGroup:
        type: string
        description: UUID or name of the operatorGroup
      reason:
        type: string
        description: Depending on the settings, this field can be mandatory or not allowed at all. Accepts UUID or name.

  PublicProgressTrailEntry:
    type: object
    properties:
      id:
        description: The UUID of the progress trail entry.
        type: string
        format: uuid
        example: a113342d-89b7-4c02-957c-af75c0505fd1
      entryDate:
        description: The modification date of the memo entry, the creation date in case there were no modifications.
        type: string
        format: date-time
        example: "2018-04-23T10:09:00+0000"
      creationDate:
        description: The creation date of the memo entry. Only filled when the type of the entry is 'memo'.
        type: string
        format: date-time
        example: "2018-04-23T10:04:00+0000"
      operator:
        description: The operator who created the entry. Visible only in case the operator may be shown in Self-Service Portal date/time stamps.
        $ref: '#/definitions/NameIdPair'
      person:
        description: The requester or the manager person who created this entry
        $ref: '#/definitions/NameIdPair'
      type:
        description: The type of this entry
        type: string
        enum:
          - memo
          - attachment
          - link
        example: memo
      memoText:
        description: |
          The text of the memo, including the HTML formatting and optionally also base64 inlined images or placeholder characters.
          Only filled when the type of the entry is 'memo'.
        type: string
        example: This is a memo text
      plainText:
        description: |
          The text of the memo, without any HTML formatting. May contain placeholder characters.
          Only filled when the type of the entry is 'memo'.
        type: string
        example: This is a memo text
      fileName:
        description: The name of the attached file. Only filled if the type of the entry is 'attachment'.
        type: string
        example: file.jpg
      downloadUrl:
        description: |
          The url where the attachment can be downloaded. Only filled if the type of the entry is 'attachment'.
          The url can be empty if the file is no longer available for download.
        type: string
        example: "/tas/api/operatorChanges/C 1505 001/attachments/9aed5c89-daf5-4d77-ae16-72ec2bd84d08"
      linkUrl:
        description: The url where the attachment can be downloaded. Only filled if the type of the entry is 'link'.
        type: string
        example: "https://www.google.de/search?q=random&tbm=isch"
      size:
        description: The size of the attached file in bytes. Only filled if the type of the entry is 'attachment'.
        type: integer
        format: int64
        minimum: 0
        example: 1024
      flag:
        description: If set to 1, this entry has been flagged for special attention.
        type: integer
        format: int32
        example: 1

  ListOfOperatorProgressTrailEntries:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/OperatorProgressTrailEntry'

  OperatorProgressTrailEntry:
    type: object
    properties:
      id:
        description: The UUID of the progress trail entry.
        type: string
        format: uuid
        example: a113342d-89b7-4c02-957c-af75c0505fd1
      entryDate:
        description: The modification date of the memo entry, the creation date in case there were no modifications.
        type: string
        format: date-time
        example: "2018-04-23T10:09:00+0000"
      creationDate:
        description: The creation date of the memo entry. Only filled when the type of the entry is 'memo'.
        type: string
        format: date-time
        example: "2018-04-23T10:04:00+0000"
      operator:
        description: The operator who created the entry. Visible only in case the operator may be shown in Self-Service Portal date/time stamps.
        $ref: '#/definitions/NameIdPair'
      person:
        description: The requester or the manager person who created this entry
        $ref: '#/definitions/NameIdPair'
      type:
        description: The type of this entry
        type: string
        enum:
          - memo
          - attachment
          - link
        example: memo
      invisibleForCaller:
        description: If true, this progresstrail entry is not shown to requesters or managers in the SSP.
        type: boolean
        example: false
      flag:
        description: If set to 1, this entry has been flagged for special attention.
        type: integer
        format: int32
        example: 1
      memoText:
        description: |
          The text of the memo, including the HTML formatting and optionally also base64 inlined images or placeholder characters.
          Only filled when the type of the entry is 'memo'.
        type: string
        example: "Dear customer, please call me."
      plainText:
        description: |
          The text of the memo, without any HTML formatting. May contain placeholder characters.
          Only filled when the type of the entry is 'memo'.
        type: string
        example: "Dear customer, please call me."
      fileName:
        description: The name of the attached file. Only filled if the type of the entry is 'attachment'.
        type: string
        example: "offer.pdf"
      downloadUrl:
        description: |
          The url where the attachment can be downloaded. Only filled if the type of the entry is 'attachment'.
          The url can be empty if the file is no longer available for download.
        type: string
        example: "/tas/api/operatorChanges/C 1505 001/attachments/ce71db71-0532-42fd-bf7e-108ccf120eaf"
      linkUrl:
        description: The url where the attachment can be downloaded. Only filled if the type of the entry is 'link'.
        type: string
        example: "https://www.google.de/search?q=random&tbm=isch"
      size:
        description: The size of the attached file in bytes. Only filled if the type of the entry is 'attachment'.
        type: integer
        format: int64
        minimum: 0
        example: 1024
      title:
        description: The title of a sent email.
        type: string
        example: "Important! Read now"
      sender:
