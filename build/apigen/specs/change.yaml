        type: string
        example: "/tas/api/operatorChanges/30309d1d-5753-420b-b9f7-fabfb2525f8d/requests"
      progressTrail:
        description: Link to the endpoint that contains the full data of the progress trail, including html and images
        type: string
        example: "/tas/api/operatorChanges/30309d1d-5753-420b-b9f7-fabfb2525f8d/progresstrail"
      managerAction:
        description: The action the manager took / is taking
        type: string
        enum:
          - waiting
          - submit
          - reject
          - go
          - no_go
          - cancel
        example: go
      plannedAuthorizationDate:
        description: The planned authorization date of the authorization activity.
        type: string
        format: date-time
        example: "2018-04-23T10:09:00+0000"
      creationDate:
        description: The date the authorization activity was created at.
        type: string
        format: date-time
        example: "2018-04-23T10:09:00+0000"
      modificationDate:
        description: The date the authorization activity was last modified at.
        type: string
        format: date-time
        example: "2018-04-23T10:09:00+0000"
      authorizationDate:
        description: The date the authorization activity was authorized or rejected at.
        type: string
        format: date-time
        example: "2018-04-23T10:09:00+0000"
      category:
        description: The category of the authorization activity
        $ref: '#/definitions/NameIdPair'
      subcategory:
        description: The subcategory of the authorization activity
        $ref: '#/definitions/NameIdPair'
      authorizer:
        description: The person or operator that authorized the authorization activity
        $ref: '#/definitions/TransitionPerformer'
      rejectionReason:
        description: The rejection reason in case the activity is rejected
        $ref: '#/definitions/NameIdPair'
      change:
        description: The parent change of the activity
        $ref: '#/definitions/ManagerAuthorizableChangeActivityParent'
      status:
        description: The status of the activity
        $ref: '#/definitions/NameIdPair'

  ListOfRequestEntries:
    type: object
    properties:
      results:
        type: array
        items:
          $ref: '#/definitions/RequestEntry'

  RequestEntry:
    type: object
