  /operatorChanges/{identifier}:
    patch:
      tags:
        - Working as an operator
      summary: Updates changes
      description: |
        The list of updates will be applied as one operation. That means if one of the updates fails, none of the steps will be applied.

        Also triggers Events and Actions. Note! Actions that require user interaction like "Confirm before sending"
        or "Editable before sending" will not be executed.
      consumes:
        - application/json-patch+json
      parameters:
        - name: identifier
          type: string
          in: path
          description: Id or number of the change to modify
          required: true
          x-examples:
            id:
              value: a113342d-89b7-4c02-957c-af75c0505fd1
              summary: The id of a change
            number:
              value: C 1608 004
              summary: The number of a change

        - name: List of updates to apply
          required: true
          description: |
            A json list of update steps that should be applied to a change. The update steps follow
            https://tools.ietf.org/html/rfc6902.

            The updatable fields are:
              - "/requests"
              - "/progressTrail"
              - "/caller"
              - "/status"
              - "/operator"  **deprecated use /simple/assignee**
              - "/externalNumber"
              - "/template"
              - "/briefDescription"
              - "/coordinator"
              - "/category"
              - "/subcategory"
              - "/object"
              - "/branch"
              - "/impact"
              - "/benefit"
              - "/priority"
              - "/type"
              - "/location"
              - "/supplier"
              - "/emergencyChange"
              - "/caller/name"
              - "/caller/branch"
              - "/caller/location"
              - "/caller/email"
              - "/caller/phoneNumber"
              - "/optionalFields[1-2]/(number|text|boolean|date|searchlist)[1-5]"
              - "/optionalFields[1-2]/memo[1-5]"
              - "/phases"
              - "/phases/{phase}"
              - "/phases/{phase}/authorizer"
              - "/phases/{phase}/authorizer/id"
              - "/phases/{phase}/authorizer/groupId"
              - "/phases/{phase}/authorizer/type"
              - "/simple/assignee"
              - "/simple/assignee/id"
              - "/simple/assignee/groupId"
              - "/simple/assignee/type"
              - "/simple/plannedStartDate"
              - "/simple/plannedImplementationDate"
              - "/phases/rfc/plannedEndDate"
              - "/phases/progress/plannedEndDate"
              - "/phases/evaluation/plannedEndDate"
              - "/changeType"

            The requests and progressTrail allows **only text** as value. The only operation possible for "/requests" and "/progressTrail" is add.

            To change the authorizer (operator or manager) use the phases path. Via the phases **only** the authorizer can be changed.
            For information about the phases look at *MinimalChangePhases* under *Models*

            If status determines processing status is on, an update of the "/status" will e.g process the change into the next phase or reject it.
            If the change is processed in the next phase and no operator or manager is set to authorize the current phase,
            the operator doing the api call is used. For processing a change when this setting is turned off see
            /operatorChanges/{identifier}/processingStatusTransitions

            Modifying the change type is only possible during the preliminary and request for change phase. The Modification is not possible if the change contains activities or has a template applied.
            The operator needs the create permission for request for change of the change type.

            The operator that can be changed via /operator is the processing operator (Simple Change), not the authorizing operator (RfC + Extensive Change). This path is deprecated, please use /phases/authorizer or /simple/assignee to change the operator.
            
            The paths "/impact", "/benefit", "/priority", "/type", "/location", "/supplier", "/emergencyChange" and "/caller/*" support the operations replace, remove and test.
            Remove empties the field and is subject to the same checks as replace. Test does no settings or license checks, accepts archived values, and with a null value checks that the field is empty.
            Values given as "id or name" must exist and must not be archived. A name that matches more than one record is rejected. A value of the wrong JSON type is rejected.

            The paths "/impact", "/benefit", "/priority", "/type" and "/location" can only be modified when the corresponding field is enabled in the settings for the current phase or type of the change:
            the request for change settings in the preliminary and request for change phase, otherwise the settings for simple or extensive changes. A preceding "/changeType" or "/status" step in the same request counts.
            When impact, benefit and priority are all shown, changing the impact or benefit recalculates the priority from the priority matrix. To set an explicit priority, put "/priority" after "/impact" and "/benefit".
            Modifying "/location" additionally requires the housing license. Only locations visible to the operator according to the branch filters can be used. The location does not need to belong to the current branch of the change:
            the branch of the change is set to the branch of the location, the object/location choice is switched to location and the object is cleared.
            "/supplier" can only be modified for simple changes, when the supplier is enabled for simple changes.
            "/emergencyChange" only accepts a boolean value and cannot be removed.

            The "/caller/*" paths use the caller block settings and are applied in request order. Changing the branch resets the location of the requester; the email and phone number are kept. So put "/caller/branch" before "/caller/location".
            "/caller/name" switches the change to an unregistered requester with that name, keeping the current branch, location, email and phone number of the requester. It is only allowed when unregistered callers are allowed in the caller block and cannot be removed.
            An unregistered requester needs a branch at the end of the request.
            "/caller/branch" is restricted by the branch filters of the operator and also overrides the branch of a registered requester.
            "/caller/location" is only possible when the location is visible in the caller block and not read-only for registered requesters. The location must belong to the branch of the requester.
            "/caller/email" and "/caller/phoneNumber" are only possible when the field is visible in the caller block.

            The provided subcategory must be specified uniquely. If the same subcategory name is used across different categories, use the subcategory id instead, which you can get from the categories endpoint.
            
            Dates are stored with seconds precision, you can specify milliseconds in your update value, but they will be ignored. Same for test operations. 
            Removing phases planned end dates from extensive changes will switch them to automatic calculation mode if they aren't already. 
            Inversely setting them will switch them to manual mode.
          in: body
          schema:
            type: array
            items:
              $ref: '#/definitions/UpdateStep'
            example:
              - op: add
                path: /progressTrail
                value: This is a memo text
              - op: remove
                path: /operator
              - op: replace
                path: /processingStatus
                value: approved
              - op: test
                path: /operator
                value: the operator to test for
      responses:
        '204':
          description: Success
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '404':
          description: No such change
        '403':
          description: No permission for modifying this change
        '415':
          description: Unsupported Media type
    get:
      tags:
        - Working as an operator
      summary: Returns the details of the change
      description: |
        Returns the details of the change.
      produces:
        - application/json
      parameters:
        - name: identifier
          type: string
          in: path
          description: Id or number of the change to modify
          required: true
          x-examples:
            id:
              value: a113342d-89b7-4c02-957c-af75c0505fd1
              summary: The id of a change
            number:
              value: C 1608 004
              summary: The number of a change
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/OperatorChangeDetails'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '404':
          description: No such change
        '403':
          description: No permission for modifying this change

