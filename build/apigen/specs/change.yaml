      memoText:
        description: The text of the memo field, including the HTML formatting and optionally also base64 inlined images or placeholder characters
        type: string
        example: "This is a memo text."
      plainText:
        description: The text of the memo field, without any HTML formatting. May contain placeholder characters.
        type: string
        example: "This is a memo text."
      entryDate:
        description: The modification date of the memo field entry, the creation date in case there were no modifications.
        type: string
        format: date-time
        example: "2018-04-23T10:09:00+0000"
      creationDate:
        description: The creation date of the memo field entry.
        type: string
        format: date-time
        example: "2018-04-23T10:04:00+0000"
      operator:
        description: The operator who created the memo field entry. Visible only if the operator may be shown in Self-Service Portal date/time stamps.
        $ref: '#/definitions/NameIdPair'
      person:
        description: The requester or the manager person who created this memo field entry
        $ref: '#/definitions/NameIdPair'
      flag:
        description: If set to 1, this entry has been flagged for special attention.
        type: integer
        format: int32
        example: 1

  ListOfPublicProgressTrailEntries:
    type: object
    properties:
      results:
        type: array
        items:
