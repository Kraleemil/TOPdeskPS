swagger: '2.0'
info:
  description: Change Management API

    __Filters__

    Some endpoints have parameters that allow to filter the return values. If you set these all return values need to
    fulfill ALL set filter parameters. Some parameters can be repeated multiple times. In these cases the return values
    need to fulfill one of the _repeated_ parameters.
  version: 1.42.0
  title: Change Management API
  contact:
    name: TOPdesk
    url: 'http://www.topdesk.com'
    email: info@topdesk.com
basePath: /tas/api
tags:
  - name: Manager Authorizations
  - name: Requester Changes
  - name: Working as an operator
  - name: Searchlists
schemes:
  - https
host: localhost
paths:
  /requesterChanges:
    get:
      tags:
        - Requester Changes
      summary: Returns a list of changes depending on the permissions of the user or requester of the change.
      description: |
        Returns a paged list of changes where the currently logged in user is the requester of the change,
        or, depending on the user's permission, is from the same branch, department or budget holder as the requester.

        Please note that all archived changes are filtered out.

        The list is ordered on change creation date descending, i.e. the newest change will be first.

        **/tas/api/requesterChanges?id=cd98f991-8f4b-44f7-85bd-b366e6ff8768&id=57cbf771-9e75-46e5-bef8-2795982323fd**
        **/tas/api/requesterChanges?requesterId=0f981a44-661a-4971-b189-b5e563e86c89&requesterId=39ac0494-c157-4e10-a4fc-ecc3159cd743**
      produces:
        - application/json
      parameters:
        - name: id
          description: |
            Return only changes with the specified ids.
            Changes for which the currently logged in user has no permission are silently ignored and not included in the result.

            _This is a repeatable filter parameter_
          in: query
          type: array
          items:
            type: string
            format: 'uuid'
          collectionFormat: multi
        - name: requesterId
          description: |
            Return only changes requested by the person with the specified id.
            Depending on the users permission to also see requested changes from the same branch, department or budget holder,
            specifying the requester.id parameter can filter the result to only contain changes from the specified requesters.

            _This is a repeatable filter parameter_
          in: query
          type: array
          items:
            type: string
            format: 'uuid'
          collectionFormat: multi
        - name: open
          description: Return only changes that are not completed, rejected or cancelled.

            _This is a filter parameter_
          in: query
          type: boolean
        - name: pageSize
          description: Only show this amount of changes in the results. Default is 1000, maximum is 5000.
          
            _This is a filter parameter_
          in: query
          type: integer
          default: 1000
          maximum: 5000
          required: false
          x-example: 30
        - name: pageStart
          description: Start returning results at this entry. Default is 0.
            
            _This is a filter parameter_
          in: query
          type: integer
          default: 0
          required: false
          x-example: 30

      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfRequestedChanges'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access changes

  /requesterChanges/{id}:
    get:
      tags:
        - Requester Changes
      summary: Returns the details of the change by its ID in case the logged in user is the requester of the change.
      description: Returns the details of the change by its ID in case the logged in user is the requester of the change,
        or, depending on the users permission, from the same branch, department or budget holder. This endpoint listen to
        the "Detail view"-Setting under Module Settings -> Self-Service Portal -> Change Management.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the Change.
          in: path
          type: string
          required: true
          format: uuid
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ChangeDetails'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found

  /requesterChanges/{entityId}/attachments/{attachmentId}:
    get:
      tags:
        - Requester Changes
      summary: Downloads the given attachment of a change.
      parameters:
        - name: entityId
          description: The UNID (Unique ID) of the change of this attachment.
          in: path
          type: string
          required: true
          format: uuid
        - name: attachmentId
          description: The UNID (Unique ID) of this attachment.
          in: path
          type: string
          required: true
          format: uuid
      responses:
        '200':
          description: Success
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change or attachment was not found
        '500':
          description: There was an error while fetching this attachment

  /requesterChanges/{id}/attachments:
    post:
      tags:
        - Requester Changes
      summary: Uploads a file as an attachment to this change.
      description: |
        Uploads a file as an attachment to this change.
        Returns the created progress trail entry in case of success.

        Be aware that this endpoint consumes multipart/form-data. More information about this format can be found on https://tools.ietf.org/html/rfc7578
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the change of this attachment.
          in: path
          type: string
          required: true
          format: uuid
        - name: file
          description: The attachment to upload.
          in: formData
          required: true
          type: file
      responses:
        '201':
          description: Success
          schema:
            $ref: '#/definitions/PublicProgressTrailEntry'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found
        '415':
          description: Unsupported media type
        '500':
          description: Error while uploading the attachment

  /requesterChanges/{id}/progresstrail:
    get:
      tags:
        - Requester Changes
      summary: Returns the progress trail of this change.
      description: The returned entries can be memos, links or attachments.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the Change.
          in: path
          type: string
          required: true
          format: uuid
        - name: inlineimages
          description: Whether inline images should be returned.
          in: query
          type: boolean
          default: false
        - name: browserFriendlyUrls
          description: |
            Normal download urls are api urls and require a token header. This parameter causes the api to return
            urls that can be accessed by the current user by having a regular session like most web browsers do.
            These download links are valid for one hour.
          in: query
          type: boolean
          default: false
        - name: type
          description: |
            Allows for requesting only specific types of progress trail entries.
          in: query
          type: array
          collectionFormat: multi
          items:
            type: string
            enum: [memo, attachment, link]
          default: [memo, attachment, link]
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfPublicProgressTrailEntries'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found
    post:
      tags:
        - Requester Changes
      summary: Creates a new action for this change.
      description: |
        When the `textFormatting` is set to `html`, some html tags can be used for formatting. 
        But if not specified, the default formatting is `plain` which will treat everything as text. 
        All whitespace characters will be trimmed at the start and end of the text. 
        The created action is returned by the endpoint.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the Change.
          in: path
          type: string
          required: true
          format: uuid
        - name: body
          in: body
          required: true
          description: A JSON object containing the type of the progress trail entry (Only 'memo' is supported at this moment) and the text of the action.
          schema:
            $ref: '#/definitions/MinimalProgressTrailEntry'
      responses:
        '201':
          description: Success
          schema:
            $ref: '#/definitions/MemoEntry'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to create a new action for this change
        '404':
          description: The change was not found
        '415':
          description: Unsupported Media type

  /requesterChanges/{id}/requests:
    get:
      tags:
        - Requester Changes
      summary: Lists the requests for this change.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the Change.
          in: path
          type: string
          required: true
          format: uuid
        - name: inlineimages
          description: Whether inline images should be returned.
          in: query
          type: boolean
          default: false
        - name: browserFriendlyUrls
          in: query
          type: boolean
          description: |
            Normal download urls are api urls and require a token header. This parameter causes the api to return
            urls that can be accessed by the current user by having a regular session like most web browsers do.
            These download links are valid for one hour.
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfRequestEntries'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found

  /requesterChanges/{id}/orderedItems:
    get:
      tags:
        - Requester Changes
      summary: Lists the ordered items for this change.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the change.
          in: path
          type: string
          required: true
          format: uuid
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfOrderedItems'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found

  /managerAuthorizables:
    get:
      tags:
        - Manager Authorizations
      summary: Returns a list of changes or authorization activities for which the currently logged in user is the manager.
      description: |
        Please note that all archived authorization activities and changes are filtered out.
      produces:
        - application/json
      parameters:
        - name: managerAction
          description: |
            The latest action performed by the manager or 'waiting' if the manager is supposed to authorize the
            current state. _This is a repeatable filter._

            **/tas/api/managerAuthorizables?managerAction=waiting&managerAction=submit**
          in: query
          collectionFormat: multi
          type: array
          items:
            type: string
            enum:
              - waiting
              - waiting_for_someone_else
              - submit
              - reject
              - go
              - no_go
              - cancel
        - name: sort
          description: |
            A parameter to sort the results by. It is currently possible to sort on:
            * latestParticipation.date
            * modificationDate

            You can specify the direction by providing _asc_ or _desc_ separated by a colon `:` . The default is desc.
            The default is currently to sort by latestParticipation.date:desc

            **Note:** `pageSize` can only be used in combination with `sort=modificationDate`.
          type: string
          in: query
          required: false
          x-example: "modificationDate:desc"
        - name: pageSize
          description: |
            Limits the number of results returned.

            Can only be used when sorting by `modificationDate`. Using `pageSize` without `sort`, or with
            `sort=latestParticipation.date`, will result in a `400 Bad Request` response.

            When the total number of matching authorizables exceeds `pageSize`, only the first `pageSize` entries
            are returned and the response status will be `206 Partial Content`. The response does not (yet) have a
            link to retrieve the next page. If all results fit within `pageSize`, the response status will be `200 OK`.
          type: integer
          in: query
          required: false
          minimum: 0
        - name: includeCount
          description: |
            When set to `true`, the response includes a `totalCount` field with the total number of authorizables
            matching the filters, regardless of paging.
          type: boolean
          in: query
          required: false
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfManagerAuthorizables'
        '206':
          description: Partial content — more results exist than the requested pageSize
          schema:
            $ref: '#/definitions/ListOfManagerAuthorizables'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access authorization activities and changes

  /managerAuthorizableChanges/{id}:
    get:
      tags:
        - Manager Authorizations
      summary: Returns the details of a change by its ID in case the logged in user is the manager of the change.
      description: It can be the manager of the current phase or one of the previous phases. This endpoint listen to the
        "Detail view"-Setting under Module Settings -> Self-Service Portal -> Change Management.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the Change.
          in: path
          type: string
          required: true
          format: uuid
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthorizableChangeDetails'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found

  /managerAuthorizableChanges/{id}/progresstrail:
    get:
      tags:
        - Manager Authorizations
      summary: Returns the progress trail of this change.
      description: The returned entries can be memos, links or attachments.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the change.
          in: path
          type: string
          required: true
          format: uuid
        - name: inlineimages
          description: Whether inline images should be returned.
          in: query
          type: boolean
          default: false
        - name: browserFriendlyUrls
          description: |
            Normal download urls are api urls and require a token header. This parameter causes the api to return
            urls that can be accessed by the current user by having a regular session like most web browsers do.
            These download links are valid for one hour.
          in: query
          type: boolean
          default: false
        - name: type
          description: |
            Allows for requesting only specific types of progress trail entries.
          in: query
          type: array
          collectionFormat: multi
          items:
            type: string
            enum: [memo, attachment, link]
          default: [memo, attachment, link]
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfPublicProgressTrailEntries'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found
    post:
      tags:
        - Manager Authorizations
      summary: Creates a new action for this change.
      description: |
        By default the text is treated as plain text without any formatting. But by setting the `textFormatting` to `html`
        some html tags can be used for formatting. 
        All whitespace characters will be trimmed at the start and end of the text. 
        The created action is returned by the endpoint.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the Change.
          in: path
          type: string
          required: true
          format: uuid
        - name: body
          in: body
          required: true
          description: A JSON object containing the type of the progress trail entry (Only 'memo' is supported at this moment) and the text of the action.
          schema:
            $ref: '#/definitions/MinimalProgressTrailEntry'
      responses:
        '201':
          description: Success
          schema:
            $ref: '#/definitions/MemoEntry'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to create a new action for this change
        '404':
          description: The change was not found
        '415':
          description: Unsupported Media type

  /managerAuthorizableChanges/{entityId}/attachments/{attachmentId}:
    get:
      tags:
        - Manager Authorizations
      summary: Downloads the given attachment of a change.
      parameters:
        - name: entityId
          description: The UNID (Unique ID) of the change of this attachment.
          in: path
          type: string
          required: true
          format: uuid
        - name: attachmentId
          description: The UNID (Unique ID) of this attachment.
          in: path
          type: string
          required: true
          format: uuid
      responses:
        '200':
          description: Success
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change or activity was not found
        '500':
          description: There was an error while fetching this attachment

  /managerAuthorizableChanges/{id}/attachments:
    post:
      tags:
        - Manager Authorizations
      summary: Uploads a file as an attachment to this change.
      description: |
        Uploads a file as an attachment to this change.
        Returns the created progress trail entry in case of success.

        Be aware that this endpoint consumes multipart/form-data. More information about this format can be found on https://tools.ietf.org/html/rfc7578
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the change of this attachment.
          in: path
          type: string
          required: true
          format: uuid
        - name: file
          description: The attachment to upload.
          in: formData
          required: true
          type: file
      responses:
        '201':
          description: Success
          schema:
            $ref: '#/definitions/PublicProgressTrailEntry'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found
        '415':
          description: Unsupported media type
        '500':
          description: Error while uploading the attachment

  /managerAuthorizableChanges/{id}/requests:
    get:
      tags:
        - Manager Authorizations
      summary: Lists the requests for this change.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the change.
          in: path
          type: string
          required: true
          format: uuid
        - name: inlineimages
          description: Whether inline images should be returned.
          in: query
          type: boolean
          default: false
        - name: browserFriendlyUrls
          in: query
          type: boolean
          description: |
            Normal download urls are api urls and require a token header. This parameter causes the api to return
            urls that can be accessed by the current user by having a regular session like most web browsers do.
            These download links are valid for one hour.
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfRequestEntries'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found

  /managerAuthorizableChanges/{id}/orderedItems:
    get:
      tags:
        - Manager Authorizations
      summary: Lists the ordered items for this change.
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the change.
          in: path
          type: string
          required: true
          format: uuid
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfOrderedItems'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found

  /managerAuthorizableChanges/{id}/processingStatusTransitions:
    post:
      tags:
        - Manager Authorizations
      summary: Approves or rejects an authorized change.
      produces:
        - application/json
      consumes:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the change.
          in: path
          type: string
          required: true
          format: uuid
        - name: Processing status transition
          required: true
          description: |
            A JSON object containing details of the processing status transition.
            For managers only prfc, extensive_done and extensive_evaluated are available as processing status for "from".
          in: body
          schema:
            $ref: '#/definitions/MinimalProcessingStatusTransition'
      responses:
        '201':
          description: Success
          schema:
            $ref: '#/definitions/ProcessingStatusTransition'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission for processing status transition
        '404':
          description: The change was not found
        '415':
          description: Unsupported Media type

  /operatorChanges:
    get:
      tags:
        - Working as an operator
      summary: Get a list of changes
      description: |
        Get a list of changes. Use the <b>fields</b> parameter to select only the fields you are interested in and filter the results with the parameter <b>query</b>.

        **/tas/api/operatorChanges?fields=id,changeType&query=phase=in=(prfc,rfc,simple)**

        Without specifying the `fields` parameter the legacy response (limited fields) will be returned which looks like below:
        ```json
        {
          "results": [
            {
              "id": "a113342d-89b7-4c02-957c-af75c0505fd1",
              "number": "C 1805 0002",
              "briefDescription": "Description of a change",
              "changeType": "simple",
              "archived": false,
              "creationDate": "2019-04-28T10:09:00+0000",
              "modificationDate": "2018-08-28T10:09:00+0000",
              "status": {
                "id": "a113342d-89b7-4c02-957c-af75c0505fd1",
                "name": "Name of item"
              },
              "simple": {
                "plannedImplementationDate": "2018-04-23T10:09:00+0000",
                "implementationDate": "2018-04-23T10:09:00+0000",
                "closedDate": "2018-04-23T10:09:00+0000",
                "assignee": {
                  "id": "a247jedd-69b7-4cbd-9dw1-af25h5g505fd1",
                  "name": "Dawn Meadows",
                  "groupId": "a113342d-89b7-4c02-957c-af75c0505fd1",
                  "groupName": "IT Services",
                  "type": "operator"
                }
              }
            }
          ]
        }
        ```
      produces:
        - application/json
      parameters:
        - name: query
          type: string
          in: query
          description: "<p>A FIQL search expression to filter the result. You cannot mix the old filtering and FIQL. If you do, the request will fail with a Bad Request (status code 400) error.

                The FIQL query syntax is documented in the <a href=\"../tutorial.html#show-collapse-query-overview\">tutorial</a>.</p>
                <p>Note that for boolean fields only equal and not equal operators are supported.</p>

                <p>The fields available for filtering are:<br>
                <ul>
                <li>simple.assignee.groupName</li>
                <li>simple.assignee.group.name</li>
                <li>simple.assignee.groupId</li>
                <li>simple.assignee.group.id</li>
                <li>simple.assignee.name</li>
                <li>simple.assignee.id</li>
                <li>simple.plannedImplementationDate</li>
                <li>simple.closedDate</li>
                <li>number</li>
                <li>changeType</li>
                <li>phase</li>
                <li>status</li>
                <li>creationDate</li>
                <li>closedDate (applies for both types of changes, for simple the closed date and for extensive changes the final date is used)</li>
                <li>open</li>
                <li>archived</li>
                <li>briefDescription</li>
                <li>modificationDate</li>
                <li>simple.implementationDate</li>
                <li>archiveReason.id</li>
                <li>archiveReason.name</li>
                <li>branch.id</li>
                <li>branch.name</li>
                <li>incident.id</li>
                <li>incident.number</li>
                <li>location.id</li>
                <li>location.name</li>
                <li>milestone.id</li>
                <li>milestone.name</li>
                <li>submitDate</li>
                <li>supplier.id</li>
                <li>supplier.name</li>
                <li>creator.id</li>
                <li>creator.name</li>
                <li>modifier.id</li>
                <li>modifier.name</li>
                <li>version.id</li>
                <li>version.name</li>
                <li>withEvaluation</li>
                <li>template.id</li>
                <li>template.name</li>
                <li>type.id</li>
                <li>type.name</li>
                <li>requester.id</li>
                <li>requester.name</li>
                <li>requester.branch.id</li>
                <li>requester.branch.name</li>
                <li>requester.location.id</li>
                <li>requester.location.name</li>
                <li>requester.department.id</li>
