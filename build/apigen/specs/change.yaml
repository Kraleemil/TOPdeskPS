          description: The UNID of the action to delete.
          in: path
          type: string
          required: true
      responses:
        '204':
          description: Success
        '400':
          description: Invalid query parameter(s)
        '401':
          description: Not authenticated
        '403':
          description: No permission to access change
        '404':
          description: The change or action was not found

  /operatorChanges/{identifier}/timeRegistration:
    get:
      tags:
        - Working as an operator
      summary: Returns the time registration entries of this change.
      description: |
        Returns the time registration entries for this change. Time registration is only supported for simple changes and needs to be enabled in the settings.
      produces:
        - application/json
      parameters:
        - name: identifier
          description: The UNID (Unique ID) or number of the Change.
          in: path
          type: string
          required: true
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfTimeRegistrationEntries'
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found
    post:
      tags:
        - Working as an operator
      summary: Adds a time registration entry to this change.
      description: |
        Adds a time registration entry to this change. Time registration is only supported for simple changes and needs to be enabled in the settings.

        If `entryDate` is not provided, the current date and time is used. If `operator` is not provided, the currently logged in operator is used.
        Registering time for another operator requires the `Time registration for other operators` permission.

        Depending on the settings, `reason` either is mandatory or not allowed at all, and `note` can be mandatory.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: identifier
          description: The UNID (Unique ID) or number of the Change.
          in: path
          type: string
          required: true
        - name: body
          in: body
          required: true
          description: A JSON object containing the time registration entry to add.
          schema:
            $ref: '#/definitions/TimeRegistrationCreate'
      responses:
        '201':
          description: Success
          schema:
            $ref: '#/definitions/TimeRegistrationEntry'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change, or no permission to register time for another operator
        '404':
          description: The change was not found
        '415':
          description: Unsupported Media type

  /operatorChanges/{id}/progresstrail:
    get:
      tags:
        - Working as an operator
      summary: Returns the progress trail of this change.
      description: |
        The returned entries can be memos, links, emails or attachments.
        To get more details from emails use the general endpoint http://topdesk-url/tas/api/emails/id/{id}
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) or number of the Change.
          in: path
          type: string
          required: true
        - name: inlineimages
          description: Whether inline images should be returned.
          in: query
          type: boolean
          default: false
        - name: browserFriendlyUrls
          description: |
            Normal download urls are api urls and require a token header. This parameter causes the api to return
            urls that can be accessed by the current user by having a regular session like most web browsers do.
            These download links are valid for one hour.
          in: query
          type: boolean
          default: false
        - name: type
          description: |
            Allows for requesting only specific types of progress trail entries.
          in: query
          type: array
          collectionFormat: multi
          items:
            type: string
            enum: [memo, attachment, link, email]
          default: [memo, attachment, link, email]
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfOperatorProgressTrailEntries'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to access change
        '404':
          description: The change was not found
    post:
      tags:
        -  Working as an operator
      summary: Creates a new action for this change.
      description: |
        When the `textFormatting` is set to `html`, some html tags can be used for formatting. 
        But if not specified, the default formatting is `plain` which will treat everything as text. 
        All whitespace characters will be trimmed at the start and end of the text. 
        The created action is returned by the endpoint.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: id
          description: The UNID (Unique ID) of the Change.
          in: path
          type: string
          required: true
          format: uuid
        - name: body
          in: body
          required: true
          description: A JSON object containing the type of the progress trail entry (Only 'memo' is supported at this moment) and the text of the action.
          schema:
            $ref: '#/definitions/MinimalProgressTrailEntry'
      responses:
        '201':
          description: Success
          schema:
            $ref: '#/definitions/MemoEntry'
        '400':
          description: Invalid input data
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to create a new action for this change
        '404':
          description: The change was not found
        '415':
          description: Unsupported Media type

