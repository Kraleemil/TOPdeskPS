  /changeCalendar:
    get:
      tags:
        - Working as an operator
      summary: Returns a list of upcoming changes and activities in a specified date range.
      description: |
        This endpoint includes changes and activities. If you are only interested in changes make sure to filter on changes.
        For activities to appear in this endpoint the option "Display in Calendar" under "Planning" on the activity card has to be set.

        Start and end date are mandatory.

        Filtering on multiple cardTypes, branches, categories, subcategories and types is possible.

        For example if you want all the extensive changes from the Delft and Kaiserslautern branch you would add the parameters like this:

        **/tas/api/changeCalendar?start=2017-01-01T00:00:00Z&end=2017-05-07T23:59:59Z&cardType=change_simple&branch=Delft&branch=Kaiserslautern**

        **/tas/api/changeCalendar?start=1970-01-01&end=2018-05-05&cardType=change_simple&cardType=change_extensive**
      produces:
        - application/json
      parameters:
        - name: start
          description: "The (planned) start date of a change or activity. For example: 2017-05-07T13:10:04+01:00

             _This is a mandatory filter parameter_"
          type: string
          format: date-time
          required: true
          in: query
        - name: end
          description: "The (planned) end date of a change or activity. For example: 2017-05-07T13:10:04+01:00

             _This is a mandatory filter parameter_"
          type: string
          format: date-time
          required: true
          in: query
        - name: cardType
          description: List of the card types.

            _This is a repeatable filter parameter_
          in: query
          type: array
          items:
            type: string
            enum:
              - change_simple
              - change_extensive
              - undefined
              - activity_authorization
              - activity_normal
          collectionFormat: multi
        - name: branch
          description: The branch of the change or activity (location on the change or activity card). Accepts id or name of the branch.

            _This is a repeatable filter parameter_
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: category
          description: Category of a change or activity. Accepts id or a name of a category.

            _This is a repeatable filter parameter_
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: subcategory
          description: Sub-category of a change or activity. Accepts id or a name of a sub-category.

            _This is a repeatable filter parameter_
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: status
          description: The userdefined status of the change or activity. Accepts id or name of the status.

            _This is a repeatable filter parameter_
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: type
          description: The userdefined type of the change (only works for changes). It is not the same as the cardType given above. Accepts id or a name of a type.

            _This is a repeatable filter parameter_
          in: query
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: currentState
          description: Current state of the change or activity.

            _This is a repeatable filter parameter_
          in: query
          type: array
          items:
            type: string
            enum:
              - planned
              - in_progress
              - done
          collectionFormat: multi
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/ListOfCalendarEntries'
        '400':
          description: Invalid query parameter(s)
        '401':
          description: The user cannot use this endpoint.
        '403':
          description: No permission to read changes or activities

