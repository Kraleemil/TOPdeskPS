      parameters:
        - name: query
          in: query
          description: |
            A FIQL search expression to filter the result. The FIQL query syntax is documented in the
            <a href="https://developers.topdesk.com/tutorial.html#show-collapse-query-overview">tutorial</a>.
          schema:
            type: string
        - name: fields
          in: query
          description: |
            The fields or objects to include in the response. By using `all` or `*` the all supported fields are returned.
          schema:
            type: string
        - name: sort
          in: query
          description: |
            The returned objects are sorted by the given field names, and by the given ascending/descending directions.
            When no direction is given `asc` will be used by default.

            When no sorting information is provided items will be sorted by `name:asc` by default.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    type: array
                    items:
                      $ref: '#/components/schemas/grouping'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
components:
  schemas:
    operationalActivityCommon:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the operational activity.
        number:
          type: string
          description: Number of the operational activity.
        briefDescription:
          type: string
          description: Brief description of the operational activity.
        plannedStartDate:
          type: string
          format: date-time
          description: Planned start date of the operational activity. Conforms to ISO-8601.
        plannedEndDate:
          type: string
          format: date-time
          description: Planned end date of the operational activity. Conforms to ISO-8601.
        creationDate:
          type: string
          format: date-time
          description: Creation date of operational activity
        modificationDate:
          type: string
          format: date-time
          description: Modification date of operational activity
        category:
          $ref: '#/components/schemas/IdAndName'
        subcategory:
          $ref: '#/components/schemas/IdAndName'
        type:
          $ref: '#/components/schemas/IdAndName'
        operator:
          $ref: '#/components/schemas/operator'
        operatorGroup:
          $ref: '#/components/schemas/IdAndName'
        status:
          $ref: '#/components/schemas/IdAndName'
        resolved:
          allOf:
            - $ref: '#/components/schemas/booleanAndDateTime'
            - description: When the operational activity is resolved this contains date and time when it was resolved.
        skipped:
          allOf:
            - $ref: '#/components/schemas/booleanAndReason'
            - description: Whether the operational activity is skipped and the reason for skipping.
        anomaly:
          allOf:
            - $ref: '#/components/schemas/booleanAndReason'
            - description: Whether an anomaly occured related to the operational activity and the reason for the anomany.
        archived:
          allOf:
            - $ref: '#/components/schemas/booleanAndReason'
            - description: Whether the operational activity is archived and the reason for archiving.
        supplier:
          $ref: '#/components/schemas/IdAndName'
        series:
          $ref: '#/components/schemas/series'
        grouping:
          $ref: '#/components/schemas/IdAndName'
        schema:
          $ref: '#/components/schemas/IdAndName'
        estimatedCosts:
          type: number
          format: double
          example: 12.22
        costs:
          type: number
          format: double
          example: 12.22
        estimatedTime:
          type: integer
          example: 62
          description: returns the estimated time in minutes.
        requests:
          type: string
          description: link to the list of requests for given operational activity
        actions:
          type: string
          description: link to the list of actions for given operational activity
        optionalFields1:
          $ref: '#/components/schemas/OptionalFields'
        optionalFields2:
          $ref: '#/components/schemas/OptionalFields'
        bookmarked:
          type: boolean
          description: |
            Warning: This shows whether the current operator has bookmarked the operational activity. Please note that calling it with different operators can show different results.
            Deprecated: This is a temporary field that will be removed in a future release.

    operationalActivityInList:
      allOf:
        - $ref: '#/components/schemas/operationalActivityCommon'
        - type: object
          properties:
            linkedBranches:
              type: array
              items:
                $ref: '#/components/schemas/IdAndName'
              description: list of ids of linked branches
            linkedAssets:
              type: array
              items:
                $ref: '#/components/schemas/IdOnly'
              description: |
                Ids of all linked assets.  
                Note: Database filters might prevent you from accessing some of the assets included in this list.
            linkedLocations:
              type: array
              items:
                $ref: '#/components/schemas/IdAndName'
    OperationalActivityCollection:
      type: object
      properties:
        item:
          type: array
          items:
            $ref: '#/components/schemas/OperationalActivityWithAllFields'
        next:
          type: string
          description: |
            In case there are more items this fields contains link to a next page, otherwise is null.

    OperationalActivityWithAllFields:
      allOf:
        - $ref: '#/components/schemas/operationalActivityCommon'
        - type: object
          properties:
            linkedLocations:
              type: array
              items:
                $ref: '#/components/schemas/LinkedLocation'
            linkedAssets:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
              description: |
                Ids of all linked assets.  
                Note: Database filters might prevent you from accessing some of the assets included in this list.
            linkedBranches:
              type: array
              items:
                $ref: '#/components/schemas/IdAndName'
            nextInSeries:
              type: object
              description: The next operational activity in the series, if the current one is part of a series, and the next is generated. Operational activities in series are ordered by their plannedStartDate. If the next operational activity is not generated yet, but it is expected to be generated in the future based on the settings of the series, then a calculated plannedStartDate field is returned, and only that within nextInSeries. If next activity in the series is not expected, then nextInSeries is not included in the response.
              properties:
                id:
                  type: string
                  format: uuid
                  description: UUID of the operational activity.
                number:
                  type: string
                  description: Number of the operational activity.
                plannedStartDate:
                  type: string
                  format: date-time
                  description: |
                    Planned start date of the operational activity, or, if the next operational activity is not generated yet, 
                    but it is expected in the future, a calculated expected start date. The calculated value is based
                    on the configured recurrence pattern and the start date of the series. Conforms to ISO-8601.
                    
                    _NOTE_: a calculated expected start date is only available for detail endpoint (single operational activity endpoint)
                resolved:
                  allOf:
                    - $ref: '#/components/schemas/booleanAndDateTime'
                    - description: Whether the operational activity is resolved and the date and time of resolution.
                skipped:
                  allOf:
                    - $ref: '#/components/schemas/booleanAndReason'
                    - description: Whether the operational activity is skipped and the reason for skipping.

    LinkedLocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        branch:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    listOfIdAndName:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/IdAndName'
    operationalActivity:
      allOf:
        - $ref: '#/components/schemas/operationalActivityCommon'
        - type: object
          properties:
            nextInSeries:
              type: object
              description: The next operational activity in the series, if the current one is part of a series, and the next is generated. Operational activities in series are ordered by their plannedStartDate. If the next operational activity is not generated yet, but it is expected to be generated in the future based on the settings of the series, then a calculated plannedStartDate field is returned, and only that within nextInSeries. If next activity in the series is not expected, then nextInSeries is not included in the response.
              properties:
                id:
                  type: string
                  format: uuid
                  description: UUID of the operational activity.
                number:
                  type: string
                  description: Number of the operational activity.
                plannedStartDate:
                  type: string
                  format: date-time
                  description: Planned start date of the operational activity, or, if the next operational activity is not generated yet, but it is expected in the future, a calculated expected start date. The calculated value is based on the configured recurrence pattern and the start date of the series. Conforms to ISO-8601.
                resolved:
                  allOf:
                    - $ref: '#/components/schemas/booleanAndDateTime'
                    - description: Whether the operational activity is resolved and the date and time of resolution.
                skipped:
                  allOf:
                    - $ref: '#/components/schemas/booleanAndReason'
                    - description: Whether the operational activity is skipped and the reason for skipping.
            costs:
              type: number
              format: long
    createOperationalActivity:
      type: object
      properties:
        briefDescription:
          type: string
          minLength: 1
          maxLength: 80
        plannedStartDate:
          type: string
          format: date-time
        plannedEndDate:
          type: string
          format: date-time
        request:
          description: |
            Initial request (description).
            The following html tags can be used to format the text:
            * \<i\>
            * \<em\>
            * \<b\>
            * \<strong\>
            * \<br\>
            * \<u\>
            * \<h5\>
            * \<h6\>
            * \<ul\>
            * \<ol\>
            * \<li\>
          type: string
        action:
          description: |
            Initial action.
            The following html tags can be used to format the text:
            * \<i\>
            * \<em\>
            * \<b\>
            * \<strong\>
            * \<br\>
            * \<u\>
            * \<h5\>
            * \<h6\>
            * \<ul\>
            * \<ol\>
            * \<li\>
          type: string
        type:
          $ref: '#/components/schemas/IdAndName'
        category:
          $ref: '#/components/schemas/CategoryForCreation'
        subcategory:
          $ref: '#/components/schemas/SubcategoryForCreation'
        operator:
          $ref: '#/components/schemas/OperatorForCreation'
        operatorGroup:
          $ref: '#/components/schemas/OperatorGroupForCreation'
        status:
          $ref: '#/components/schemas/IdAndName'
        supplier:
          $ref: '#/components/schemas/IdAndName'
        estimatedCosts:
          type: number
        costs:
          type: number
          format: double
        estimatedTime:
          type: number
        optionalFields1:
          $ref: "#/components/schemas/OptionalFields"
        optionalFields2:
          $ref: "#/components/schemas/OptionalFields"
      required: ["briefDescription", "plannedStartDate", "plannedEndDate"]
    IdOnly:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the object.
    IdAndName:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the object.
        name:
          type: string
          description: The name of the object.
          example: "Name of item"
    IdAndNameOrNull:
      allOf:
        - $ref: '#/components/schemas/IdAndName'
      nullable: true
    CategoryForCreation:
      allOf:
        - $ref: '#/components/schemas/IdAndName'
        - type: object
          description: |
            Needs to be used together with `subcategory`.
    SubcategoryForCreation:
      allOf:
        - $ref: '#/components/schemas/IdAndNameOrNull'
        - type: object
          description: |
            Needs to be used together with `category`.
          properties:
            id:
              type: string
              format: uuid
              description: |
                Must represent existing *subcategory* id.
            name:
              description: |
                Must represent existing and unique *subcategory* name.
    OperatorForCreation:
      allOf:
        - $ref: '#/components/schemas/IdAndNameOrNull'
        - type: object
          description: |
            Needs to be used together with `operatorGroup`.
          properties:
            id:
              type: string
              format: uuid
              description: |
                Must represent existing *operator* or *operatorGroup* id.
            name:
              description: |
                Must represent existing *operator* or *operatorGroup* name.
    OperatorGroupForCreation:
      allOf:
        - $ref: '#/components/schemas/IdAndNameOrNull'
        - type: object
          description: |
            Needs to be used together with `operator`.
          properties:
            id:
              type: string
              format: uuid
              description: |
                Must represent existing *operator group* id.
            name:
              description: |
                Must represent existing *operator group* name.
    operator:
      allOf:
        - $ref: '#/components/schemas/IdAndName'
        - type: object
          properties:
            type:
              type: string
              example: operator
              description: Type of the operator is either `operator` or `operatorGroup`.
    series:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the series.
        briefDescription:
          type: string
          description: Brief description of the series.
        number:
          type: string
          description: Number of the series.
    booleanAndDateTime:
      type: object
      properties:
        value:
          type: boolean
        dateTime:
          type: string
          format: date-time
          description: Conforms to ISO-8601.
    booleanAndReason:
      type: object
      properties:
        value:
          type: boolean
        reason:
          $ref: '#/components/schemas/IdAndName'
    linkWithProperties:
      allOf:
        - $ref: '#/components/schemas/IdAndName'
        - type: object
          properties:
            branch:
              $ref: '#/components/schemas/IdAndName'
            location:
              $ref: '#/components/schemas/IdAndName'
            type:
              $ref: '#/components/schemas/IdAndName'
    editableFieldsOfOperationalActivity:
      type: object
      properties:
        status:
          type: string
          format: uuid
        anomaly:
          type: object
          description: Non-null or empty reason is accepted only when value is true
          properties:
            value:
              type: boolean
              example: true
            reason:
              type: string
              format: uuid
        skipped:
          type: object
          description: Non-null or empty reason is accepted only when value is true. Skipped value can be true only when resolved is false.
          properties:
            value:
              type: boolean
              example: true
            reason:
              type: string
              format: uuid
        resolved:
          type: object
          description: Non-null or empty dateTime is accepted when value is true. Resolved value can be true only when skipped is false.
          properties:
            value:
              type: boolean
