          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/emailInList'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /operationalActivities/{identifier}/emails/{emailId}:
    get:
      tags:
        - Operational Activities
      summary: Retrieves an email of an operational activity by id.
      description: Archived emails are also returned by this endpoint.
      parameters:
        - name: identifier
          in: path
          description: The id of the operational activity
          required: true
          schema:
            type: string
            format: uuid
        - name: emailId
          in: path
          description: The id of the email
          required: true
          schema:
            type: string
            format: uuid
        - name: fields
          in: query
          description: The fields or objects to include in the response. All properties of '#/components/schemas/email' are available. They are separated by comma. By using `all` the whole object is returned.
          required: false
          schema:
            type: string
            default: id,subject,content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/email'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /operationalActivities/statuses:
    get:
