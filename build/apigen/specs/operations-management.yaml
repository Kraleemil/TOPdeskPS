  /operationalActivities/schemas:
    get:
      summary: Get list of schemas for operational activities
      description: |
        Returns list of schemas for operational activities. Client has to have read permission for operational activities or
        read permission for schemas.
      tags:
        - Searchlists
      parameters:
        - name: query
          in: query
          description: |
            A FIQL search expression to filter the result. The FIQL query syntax is documented in the
            <a href="https://developers.topdesk.com/tutorial.html#show-collapse-query-overview">tutorial</a>.
          schema:
            type: string
        - name: fields
          in: query
          description: |
            The fields or objects to include in the response. By using `all` or `*` the all supported fields are returned.
          schema:
            type: string
        - name: sort
          in: query
          description: |
            The returned objects are sorted by the given field names, and by the given ascending/descending directions.
            When no direction is given `asc` will be used by default.
            
            When no sorting information is provided items will be sorted by `name:asc` by default.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    type: array
                    items:
                      $ref: '#/components/schemas/schemas'

        '400':
          description: Bad Request
        '403':
          description: Forbidden
  /operationalActivities/groupings:
    get:
      summary: Get list of groupings for operational activities
      description: |
        Returns list of groupings for operational activities. Client has to have read permission for operational activities.
      tags:
