paths:
  "/avatars/operator/{id}":
    get:
      tags:
        - Avatars
      summary: Get avatar of operator by id
      description: >-
        | Permission | Remarks |

        | --- | --- |

        | Operator | Read access |

        | Person | No access |
      operationId: getOperatorAvatar
      parameters:
        - name: id
          in: path
          description: The operator id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The avatar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarDto"
        "401":
          description: |-
            * No authentication token provided<br/>Example:
              * `No authentication token provided`
            * Authentication token is not operator token<br/>Example:
              * `User removed or archived`
        "404":
          description: "* The entity was not found"
        "500":
          description: "* Error occurred on the server"
  "/avatars/person/{id}":
    get:
      tags:
        - Avatars
      summary: Get avatar of person by id
      description: >-
        <h3>Note:</h3><p>This endpoint is designed for general access. For
        branch-restricted access, use the <a
        href="../../documentation/index.html#api-Person-GetAvatorForPerson">persons
        avatar endpoint</a>.</p>


        | Permission | Remarks |

        | --- | --- |

        | Operator | Read access |

        | Person | Read access |
      operationId: getPersonAvatar
      parameters:
        - name: id
          in: path
          description: The person id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The avatar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarDto"
        "401":
          description: "* No authentication token provided"
        "404":
          description: "* The entity was not found"
        "500":
          description: "* Error occurred on the server"
  /branches:
    get:
      tags:
        - Branches
      summary: Get list of branches
      description: >
        | Permission | Remarks |

        | --- | --- |

        | Operator | Branch filters apply |

        | Person | No access |
      operationId: retrieveBranches
      parameters:
        - name: $fields
          in: query
          description: Only include these specific fields in the response.
          required: false
          example: name,specification,headBranch
          schema:
            type: string
            default: id,name
        - name: query
          in: query
          description: "A FIQL search expression to filter the result. The query
            parameters from earlier versions still work, but if this parameter
            is provided, all other filter parameters are ignored. The FIQL query
            syntax is documented in the <a
            href=\"../tutorial.html#show-collapse-query-overview\">tutorial</a>\
            .<br/><br/>The fields available for filtering are: <ul><li>All
            top-level fields in the returned object</li><li>address and
            postalAddress: all sub-fields, including id and name for
            country</li><li>realEstate: all sub-fields, including id and name
            for designatedUse, listedBuilding, energyPerformance,
            environmentalImpact and buildingLevelEPC</li><li>headBranch.id,
            headBranch.name</li><li>accountManager.id,
            accountManager.name</li><li>contact.id,
            contact.name</li><li>attention.id,
            attention.name</li><li>serviceWindow.id,
            serviceWindow.name</li><li>creator.id,
            creator.name</li><li>modifier.id,
            modifier.name</li><li>optionalFields1, optionalFields2: All
            subfields, including id and name for
            searchlists</li><li>externalLink.id, externalLink.type,
            externalLink.date</li><li>archived</li></ul>\r

            When query parameter is used both archived and
            non-archived branches are returned by default."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The list of branches. If query parameter is not used only active
            branches are returned by default
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtendedBranchDto"
        "400":
          description: |
            * The parameters of the request were malformed<br/>Example:
              * `Input parameters malformed`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponseEntity"
        "401":
          description: |-
            * No authentication token provided<br/>Example:
              * `No authentication token provided`
            * Authentication token is not operator token<br/>Example:
              * `User removed or archived`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponseEntity"
        "403":
          description: |-
            * Returned for person requestors when locations are not editable in SSP<br/>Example:
              * `No permission to access the entity`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: |-
            * Error occurred on the server<br/>Example:
              * `An error occurred on the server`
    post:
      tags:
        - Branches
      summary: Create a branch
      description: |
        | Permission | Remarks |
        | --- | --- |
        | Operator | With read and create permission on branches |
        | Person | No access |
      operationId: createBranch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyExtendedBranchDto"
        required: true
      responses:
        "201":
          description: The created branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtendedBranchDto"
        "400":
          description: >
            * The request is lacking one of the mandatory fields.<br/>Example:
              * `Mandatory field '<fieldname>' is missing.`
            * The request contains a field that does not exist<br/>Example:
              * `The field "<fieldname>" does not exist.`
            * The request contains a value for a field where the format is wrong. For example, `true` mistyped, or the UUID in the wrong format<br/>Example:
              * `The value for the field "<fieldname>" cannot be parsed`
            * The request contains a field with an id value which is not existing in the database. For example, country id or head branch id.

            * The request contains a value for a string field which is too long. For example, name can only be 60 characters long.
            
            * The provided head branch cannot be found.

            * The provided head branch is not compatible with the selected branch type.<br/>Examples:
              * `Branch type 'independentBranch' was selected, a head branch is not allowed for this type.`
              * `Branch type 'hasAHeadBranch' was selected, but no head branch was given.`
              * `Branch type 'hasAHeadBranch' was selected, but the given head branch is not of headBranch type.`
            * The branch type is invalid.<br/>Example:
              * `The value of 'branchType' is invalid. The only valid values are: 'independentBranch', 'headBranch', and 'hasAHeadBranch'.`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |-
            * No authentication token provided<br/>Example:
              * `No authentication token provided`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponseEntity"
        "403":
          description: |-
            * No permission to create branches.<br/>Example:
              * `No permission to create branches`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: |-
            * Error occurred on the server<br/>Example:
              * `An error occurred on the server`
