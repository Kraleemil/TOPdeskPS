  /requester/persons:
    get:
      tags:
        - Requester Persons
      summary: Get list of persons for SSP user. Only returns persons that are marked as callers (requesters) and are active (not archived).
      description: >
        | Permission | Remarks |

        | --- | --- |

        | Operator | No access |

        | Person | Only accessible when phonebook is enabled |


        **NOTE**: For performance reasons this endpoint will only include a limited set of fields by default. To get different or specific fields, please use the 'fields' parameter.

      operationId: retrievePersonsForRequester
      parameters:
        - name: pageStart
          in: query
          description: The offset at which to start listing the persons at. Must be
            greater or equal to `0`, default is `0`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          description: The amount of persons to be returned per request. Must be between
            `1` and `5000`, default is `50`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 5000
            default: 50
        - name: fields
          in: query
          description: |
            Only include these specific fields in the response. The following fields are supported:
            `id`, `firstName`, `surName`, `dynamicName`, `phoneNumber`, `mobileNumber`, `fax`, `email`, `jobTitle`, `department`, `department.id`, `department.name`, `city`, `branch`, `branch.id`, `branch.name`, `branch.phoneNumber`, `location`, `location.id`, `location.name`.
          required: false
          example: firstName,surName
          schema:
            type: string
        - name: sort
          in: query
          description: |
            The returned objects are sorted by the given field names, and by the given ascending/descending directions.
            When no direction is given `asc` will be used by default.<br>
            All enabled fields are supported.
          example:
            sort=surName:asc,firstName:desc
          schema:
            type: string
            default: dynamicName:asc
        - name: query
          in: query
          description: |
            A FIQL search expression to filter the result. The FIQL query syntax is documented in the
            <a href="https://developers.topdesk.com/tutorial.html#show-collapse-query-overview">tutorial</a>.
            Additionally, this version supports the =gt=, =ge=, =lt=, and =le= operators for text.
            All enabled fields are supported.<br>
            Archived persons are never returned.<br>
          example:
            query=lastName==Adams
          schema:
            type: string
      responses:
        "200":
          description: The list of persons. There are no more persons to be returned.<br>
            The 'department' field may vary based on user settings; refer to the response schema for details.
          content:
            application/x.topdesk-collection-person-v2+json:
              schema:
                $ref: "#/components/schemas/ListOfRequesterPersonsV2"
        "206":
          description: The list of persons. There are still more persons to be returned.
          content:
            application/x.topdesk-collection-person-v2+json:
              schema:
                $ref: "#/components/schemas/ListOfRequesterPersonsV2"
        "400":
          description: |
            * The parameters of the request were malformed<br/>Example:
              * `Input parameters malformed`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |-
            * No authentication token provided<br/>Example:
              * `No authentication token provided`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            * No permission to access the data<br/>Example:
              * `No permission to access the data`
            * Returned when accessing this endpoint without SSP access<br/>Example:
              * `You don't have permission to access requester endpoints`
          content:
            application/json:
              schema:
