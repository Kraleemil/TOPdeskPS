  "/branches/free_fields/{tab}/searchlists/{searchlist}":
    get:
      tags:
        - Branches
      summary: Get list of optional drop-down values for branches
      description: |
        | Permission | Remarks |
        | --- | --- |
        | Operator | With read permission on branches |
        | Person | No access |
      operationId: getBranchOptionalSearchlists
      parameters:
        - name: tab
          in: path
          description: The tab number. Must be `1` or `2`.
          required: true
          schema:
            type: integer
            format: int32
            enum:
              - 1
              - 2
        - name: searchlist
          in: path
          description: The searchlist number. Must be `1`, `2`, `3`, `4` or `5`.
          required: true
          schema:
            type: integer
            format: int32
            enum:
              - 1
              - 2
              - 3
              - 4
              - 5
        - name: external_link_id
          in: query
          description: Retrieve only optional drop-down list entries with external link id
            equal to one of these values. Should be used in combination with
            `external_link_type`
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: external_link_type
          in: query
          description: Retrieve only optional drop-down list entries with external link
            type equal to one of these values. Should be used in combination
            with `external_link_id`
          required: false
          explode: true
          schema:
