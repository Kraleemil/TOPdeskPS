        | Person | No access | |

        __*__ _This permission provides more access than required by this API._
      operationId: retrieveOperators
      parameters:
        - name: start
          in: query
          description: The offset at which to start listing the operators at. Must be
            greater or equal to `0`, default is `0`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: page_size
          in: query
          description: The amount of operators to be returned per request. Must be between
            `1` and `100`, default is `10`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: query
          in: query
          description: "A FIQL search expression to filter the result. The query
            parameters from earlier versions still work, but if this parameter
            is provided, all other filter parameters are ignored. The FIQL query
            syntax is documented in the <a
            href=\"../tutorial.html#show-collapse-query-overview\">tutorial</a>\
            .<br/><br/>The fields available for filtering are: <ul><li>All
            top-level fields in the returned object</li><li>operatorGroup: id,
            name and all tasks. This filter considers any group the operator is
            in.</li><li>language.id, language.name,
            language.code</li><li>branch.id, branch.name</li><li>location.id,
            location.name</li><li>department.id,
            department.name</li><li>budgetHolder.id,
            budgetHolder.name</li><li>attention.id,
            attention.name</li><li>creator.id, creator.name</li><li>modifier.id,
            modifier.name</li><li>optionalFields1, optionalFields2: All
            subfields, including id and name for
            searchlists</li><li>externalLink.id, externalLink.type,
            externalLink.date</li><li>archived</li><li>linkedPerson: Only equal null and not equal null is supported</li>
            <li>linkedPerson.id, linkedPerson.name: Only equal and not equal is supported</li></ul>For example, if you
            would like to get all unarchived operators that have the
            'stockManager' task or are in a group that has that task, you could
            use
            <tt>(stockManager==true,operatorGroup.stockManager==true);archived=\
            =false</tt>.<br/>When query parameter is used both archived and
            non-archived operators are returned by default."
          required: false
          example: (stockManager==true,operatorGroup.stockManager==true);archived==false
          schema:
            type: string
        - name: fields
          in: query
          description: Only include these specific fields in the response. The default is
            that all fields are included.
          required: false
          example: surName,branch
          schema:
            type: string
      responses:
        "200":
          description: The list of operators when up to `page_size` entities have been
            found. When <tt>query</tt> parameter is not used only active
            operators are returned
