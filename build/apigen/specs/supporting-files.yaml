            <a href="https://developers.topdesk.com/tutorial.html#show-collapse-query-overview">tutorial</a>.
            Additionally, this version supports the =gt=, =ge=, =lt=, and =le= operators for text.
            All enabled fields are supported except optional memo fields.<br>
            If no __query__ parameter is provided all person groups (including archived) are returned.<br>
            To return only active person groups
            use *query=archived==false*
          example:
            query=name==IT;archived==false
          schema:
            type: string
      responses:
        "200":
          description: The list of person groups. There is no more person groups to be returned.
          content:
            application/x.topdesk-collection-person-group-v2+json:
              schema:
                $ref: "#/components/schemas/ListOfPersonGroupsV2"
        "204":
          description: No entities found
        "206":
          description: The list of person groups. There are still more person groups to be returned.
