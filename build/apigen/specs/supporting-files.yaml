            greater or equal to `0`, default is `0`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          description: The amount of person groups to be returned per request. Must be between
            `1` and `5000`, default is `50`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 5000
            default: 50
        - name: fields
          in: query
          description: Only include these specific fields in the response. To include all fields use '*' or 'all'.
          required: false
          example: name,archived
          schema:
            type: string
        - name: sort
          in: query
          description: |
            The returned objects are sorted by the given field names, and by the given ascending/descending directions.
            When no direction is given `asc` will be used by default.<br>
            All enabled fields are supported except optional memo fields.
          example:
            sort=name:asc,archived:desc
          schema:
            type: string
            default: name:asc
        - name: query
          in: query
          description: |
