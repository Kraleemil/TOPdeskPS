openapi: 3.0.0
info:
  description: |
    Supporting Files API
    ## Notice
    Please be aware that some of our API endpoints have multiple available versions, which are not backward compatible.
    To ensure you are using the new version of these endpoints, you must set a specific `Accept` header in your requests. If this header is not set, the old version of the endpoint will be used by default.

    For details on which Accept header should be set for each individual endpoint, please refer to the documentation of the respective endpoint. The `media type` of the response is the `Accept` header that must be used to receive a successful response from the documented version. If multiple versions are available for an endpoint, then the latest version is documented with a reference to the documentation of the old version.

  version: 2.7.12
  title: Supporting Files API
  contact:
    name: TOPdesk
    url: http://www.topdesk.com
    email: info@topdesk.com
