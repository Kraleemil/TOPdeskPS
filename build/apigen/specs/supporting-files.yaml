  /locations:
    get:
      tags:
        - Locations
      summary: Get list of locations
      description: >
        | Permission | Remarks | Visible fields in response |

        | --- | --- | --- |

        | Operator | Branch filters apply | all |

        | Person | No access | none |
      operationId: retrieveLocations
      parameters:
        - name: query
          in: query
          description: 'A FIQL search expression to filter the result. The query
            parameters from earlier versions still work, but if this parameter
            is provided, all other filter parameters are ignored. The FIQL query
            syntax is documented in the <a
            href="../tutorial.html#show-collapse-query-overview">tutorial</a>.<br/><br/>The
            fields available for filtering are: <ul><li>All top-level fields in
            the returned object</li><li>archived: a boolean fields that acts as
            a substitute for status</li><li>functionalUse.id,
            functionalUse.name</li><li>type.id,
            type.name</li><li>budgetHolder.id,
            budgetHolder.name</li><li>branch.id,
            branch.name</li><li>majorLocation.id,
            majorLocation.name</li><li>area: all sub-fields</li><li>finishing:
            all sub-fields, including id and name for ceilingCovering,
            floorCovering, glassMaterial and
            wallCovering</li><li>reservationManagement: all sub-fields,
            including id and name for reservableByPersonGroup and
            serviceWindow</li><li>creator.id, creator.name</li><li>modifier.id,
            modifier.name</li><li>optionalFields1, optionalFields2: All
            subfields, including id and name for
            searchlists</li><li>externalLink.id, externalLink.type,
            externalLink.date</li><li>archived</li></ul></tt>.</br>When query
            parameter is used both archived and non-archived locations are
            returned by default.'
          required: false
          schema:
            type: string
        - name: $fields
          in: query
          description: Only include these specific fields in the response.
          required: false
          example: name,roomNumber
          schema:
            type: string
            default: id,name,roomNumber,branch
        - name: pageSize
          in: query
          description: "The maximum amount of locations to be returned. Default is
            unlimited. WARNING: Not setting this parameter may degrade your
            system's performance"
          required: false
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: The list of locations. If query parameter is not used only active
            locations are returned by default
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtendedLocationDto"
        "400":
          description: |
            * The parameters of the request were malformed<br/>Example:
              * `Input parameters malformed`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEntity"
        "401":
          description: |-
            * No authentication token provided<br/>Example:
              * `No authentication token provided`
            * Authentication token is not operator token<br/>Example:
              * `User removed or archived`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEntity"
        "403":
          description: |-
            * Returned for person requestors when locations are not editable in SSP<br/>Example:
              * `No permission to access the entity`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: |-
            * Error occurred on the server<br/>Example:
              * `An error occurred on the server`
    post:
      tags:
        - Locations
      summary: Create a location
      description: |
        | Permission | Remarks |
        | --- | --- |
        | Operator | With read and create permission on locations |
        | Person | No access |
      operationId: createLocation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationDto"
        required: true
      responses:
        "201":
          description: The created location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtendedLocationDto"
        "400":
          description: >
            * The request is lacking one of the mandatory fields.<br/>Example:
              * `Mandatory field '<fieldname>' is missing.`
            * The request contains a field that does not exist<br/>Example:
              * `The field "<fieldname>" does not exist.`
            * The request contains a value for a field where the format is wrong. For example, `true` mistyped, or the UUID in the wrong format<br/>Example:
              * `The value for the field "<fieldname>" cannot be parsed`
            * The request contains a field with an id value which is not existing in the database. For example, branch id or majorLocation id.

            * The request contains a value for a string field which is too long. For example, name can only be 100 characters long.
            
            * The provided branch cannot be found.

            * The provided major location is not compatible with the selected room setup.<br/>Examples:
              * `Room setup 'standardLocation' was selected, a major location is not allowed for this setup.`
              * `Room setup 'divisibleLocation' was selected, a major location is not allowed for this setup.`
              * `Room setup 'isASubLocation' was selected, but the given major location is not of divisibleLocation setup.`
            * The room setup is invalid.<br/>Example:
              * `The value of 'roomSetup' is invalid. The only valid values are: 'standardLocation', 'divisibleLocation', and 'isASubLocation'.`
            * The provided person group is not compatible with the selected reservable by option.<br/>Examples:
              * `Reservable By 'everybody' was selected, a person group is not allowed for this option.`
            * The Reservable by is invalid.<br/>Example:
              * `The value of 'reservationManagement.reservableBy' is invalid. The only valid values are: 'everybody', 'specificPersonGroup'.`
            * The provided service window is not compatible with the selected service window applies to option.<br/>Examples:
              * `Service window applies to 'noServiceWindow' was selected, a service window is not allowed for this option.`
            * The service window applies to is invalid.<br/>Example:
              * `The value of 'reservationManagement.serviceWindowAppliesTo' is invalid. The only valid values are: 'noServiceWindow', 'sspAndOperatorRealm', and 'sspOnly'.`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |-
            * No permission to create locations.<br/>Example:
              * `No permission to create locations`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: |-
            * Error occurred on the server<br/>Example:
              * `An error occurred on the server`
