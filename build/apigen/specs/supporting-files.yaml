  /persons/lookup:
    get:
      tags:
        - Persons
      summary: Returns person id, name pairs
      description: >
        | Permission | Remarks |

        | --- | --- |

        | Operator | Persons read permission required; Branch filters apply with the exception of last edited cards |

        | Person | No access |
      operationId: getPersonLookupList
      parameters:
        - name: $top
          in: query
          description: The maximum amount of persons to be returned. Must be between 1 and
            10000, default amount is 1000
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000
            default: 1000
        - name: name
          in: query
          description: Return only persons with name starting with this
          required: false
          schema:
            type: string
        - name: archived
          in: query
          description: Whether to return archived persons, if omitted both archived and
            non-archived will be returned
          required: false
          schema:
            type: boolean
        - name: isCaller
          in: query
          description: Filters persons by whether they are marked as callers (requesters). When true, only persons marked
            as callers are returned. When false, only persons not marked as callers are returned.
            If omitted, both callers and non-callers are returned.
          required: false
          schema:
            type: boolean
        - name: $all
          in: query
          description: "Returns all entities ignoring $top parameter. Default value is
            false. WARNING: enabling this may dramatically degrade your system's
            performance"
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The list of person ids and names, sorted by ascending name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List_of_Lookup_Entries"
        "400":
          description: The request was not properly formatted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEntity"
        "401":
          description: No authentication token was provided
        "403":
          description: No read permission on persons or you're not an operator
        "500":
          description: Error occurred on the server
