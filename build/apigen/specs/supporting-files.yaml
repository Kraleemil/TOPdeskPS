  /supplierContacts:
    get:
      tags:
        - Supplier contacts
      summary: Get list of supplier contacts
      description: |
        | Permission | Remarks |
        | --- | --- |
        | Operator | With read permission on supplier contacts |
        | Person | No access |
      operationId: retrieveSupplierContacts
      parameters:
        - name: page_size
          in: query
          description: The amount of suppliers to be returned per request. Must be between
            `1` and `10000`, default is `1000`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000
            default: 1000
        - name: query
          in: query
          description: 'A FIQL search expression to filter the result. The query
            parameters from earlier versions still work, but if this parameter
            is provided, all other filter parameters are ignored. The FIQL query
            syntax is documented in the <a
            href="../tutorial.html#show-collapse-query-overview">tutorial</a>.<br/><br/>The
            fields available for filtering are: <ul><li>dynamicName, initials,
            firstName, prefxes, lastName, title, jobTitle,
            gender</li><li>telephone, mobileNumber, faxNumber, email,
            additionalInfo, notes</li><li>supplier: id, name, forFirstLine,
            forSecondLine, forService, forOperationalActivity,
            forChangeManagement</li><li>optionalFields1, optionalFields2: All
            subfields, including id and name for
            searchlists</li><li>externalLink.id, externalLink.type,
            externalLink.date</li><li>archived</li></ul>For example, if you
            would like to get all unarchived supplier contacts for suppliers for
            first or second line incidents, you could use
            <tt>(supplier.forFirstLine==true,supplier.forSecondLine==true);archived==false</tt>.</br>When
            query parameter is used both archived and non-archived supplier
            contacts are returned by default.'
          required: false
          example: (supplier.forFirstLine==true,supplier.forSecondLine==true);archived==false
          schema:
            type: string
      responses:
        "200":
          description: The list of suppliers contacts. If query parameter is not used only
            active supplier contacts are returned by default
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmallSupplierContactDto"
        "400":
