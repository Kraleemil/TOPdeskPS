  /operatorgroups:
    get:
      tags:
        - Operator groups
      summary: Get list of operator groups
      description: >
        | Permission | Remarks | Visible fields in response |

        | --- | --- | --- |

        | Operator | With read permission on operator groups and permission groups; Branch/Operator filters apply with the exception of last edited cards, but operator groups that the operator is member of are not filtered | all |

        | Operator | With read permission on operator groups; Branch/Operator filters apply with the exception of last edited cards, but operator groups that the operator is member of are not filtered | all except for accessRoles |

        | Person | No access | |
      operationId: retrieveOperatorGroups
      parameters:
        - name: start
          in: query
          description: The offset at which to start listing the operator groups at. Must
            be greater or equal to `0`, default is `0`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: page_size
          in: query
          description: The amount of operator groups to be returned per request. Must be
            between `1` and `100`, default is `10`.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: query
          in: query
          description: "A FIQL search expression to filter the result. The query
            parameters from earlier versions still work, but if this parameter
            is provided, all other filter parameters are ignored. The FIQL query
            syntax is documented in the <a
            href=\"../tutorial.html#show-collapse-query-overview\">tutorial</a>\
            .<br/><br/>The fields available for filtering are: <ul><li>All
            top-level fields in the returned object, except for
            branch.id, branch.name</li><li>location.id,
            location.name</li><li>budgetHolder.id,
            budgetHolder.name</li><li>creator.id,
            creator.name</li><li>modifier.id,
            modifier.name</li><li>optionalFields1, optionalFields2: All
            subfields, including id and name for
            searchlists</li><li>externalLink.id, externalLink.type,
            externalLink.date</li><li>archived</li></ul>For example, if you
            would like to get all unarchived operator groups that have the
            'stockManager' task, and a name starting with 'IT', you could use
            <tt>stockManager==true;archived==false;name=sw=IT</tt>.<br/>When
            query parameter is used both archived and non-archived operator
            groups are returned by default."
          required: false
          example: stockManager==true;archived==false;name=sw=IT
          schema:
            type: string
        - name: fields
          in: query
          description: Only include these specific fields in the response. The default is
            that all fields are included.
          required: false
          example: groupName,branch
          schema:
            type: string
      responses:
        "200":
          description: The list of operator groups when up to `page_size` entities have
            been found. Within the contact field, the values of the department,
            telephone, faxNumber and email fields are set according to the
            operator group, not according to the contact operator. If query
            parameter is not used only active operator groups are returned by
            default
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorGroupDto"
        "204":
          description: No entities found
        "206":
          description: The list of operator groups when more than `page_size` entities
            have been found, but only so many are returned. See status `200` for
            response model.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorGroupDto"
        "400":
          description: |
            * The parameters of the request were malformed<br/>Example:
              * `Input parameters malformed`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |-
