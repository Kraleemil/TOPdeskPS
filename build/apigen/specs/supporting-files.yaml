      description: >
        | Permission | Remarks | Visible fields in response |

        | --- | --- | --- |

        | Operator | With read permission on operators and write permission on supporting files - login data __*__ ; Branch/Operator filters apply with the exception of last edited cards | all |

        | Operator | With read permission on operators and permission groups; Branch/Operator filters apply with the exception of last edited cards | all except for hasApplicationPasswords |

