---
swagger: "2.0"
info:
  description: "Settings API"
  version: "1.1.0"
  title: "Settings API"
  contact:
    name: "TOPdesk"
    url: "http://www.topdesk.com"
    email: "info@topdesk.com"
basePath: "/tas/api"
tags:
  - name: Currency
  - name: Optional Fields
paths:
  /currency:
    get:
      tags:
        - Currency
      summary: "Get the TOPdesk currency settings"
      description: |
        | Permission | Remarks |
        | --- | --- |
        | Operator | Unrestricted access |
        | Person | Unrestricted access |
      operationId: "getCurrency"
      produces:
        - "application/json"
      parameters:
        - name: authorization
          in: header
          description: 'The REST login token. See [Login](../../documentation/index.html#api-Login)<br/>Example: `TOKEN id="cd6cf9c2-662c-495d-82f6-dc0435b882f5"`'
          required: true
          type: string
      responses:
        200:
          description: "The TOPdesk currency settings"
          schema:
            $ref: "#/definitions/currencyResponse"
        401:
          description: "No authentication token provided."
  /optionalfields/{table}/fields/{type}:
    get:
      deprecated: true
      tags:
        - Optional Fields
      summary: "Retrieve names of the enabled optional fields for the specified database table and field type"
      description: |
        _This endpoint does not meet our internal standards and might be removed or change drastically._
        
        | Permission | Remarks |
        | --- | --- |
        | Operator | Unrestricted access |
        | Person | Unrestricted access |
      operationId: "getEnabledOptionalFields"
      produces:
        - "application/json"
      parameters:
        - name: table
          in: path
          description: 'The database table, for example: persoon'
          required: true
          type: string
        - name: type
          in: path
          description: 'The field type (boolean, text, datetime, search_field, number and memo are supported)'
          required: true
          type: string
        - name: authorization
          in: header
          description: 'The REST login token. See [Login](../../documentation/index.html#api-Login)<br/>Example: `TOKEN id="cd6cf9c2-662c-495d-82f6-dc0435b882f5"`'
          required: true
          type: string
      responses:
        200:
          description: "The names of the enabled optional fields for the specified database table and field type where successfully retrieved."
          schema:
            type: object
            additionalProperties:
              type: string
            example:
              vrijedatum1: Birthday
              vrijedatum2: Start Date
              vrijetekst1: Job Title
        400:
          description: >
            There were errors in the request. This could be because one of the following reasons:

            - The database table does not exist.

            - The database table does not have optional fields.

            - The field type is not supported.
        401:
          description: "No authentication token provided."
definitions:
  currencyResponse:
    type: object
    properties:
      currencyPrefix:
        type: string
        description: "The currency prefix."
        example: "€"
      currencyPostfix:
        type: string
        description: "The currency postfix."
        example: "euro"
